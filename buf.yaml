# Buf workspace configuration.
#
# The protocol module lives at `proto/`. Additional modules (for
# example a future internal API protocol or a separate driver
# extension namespace) can be added to the `modules` list below.

version: v2

modules:
  - path: proto
    # `proto/grpc/health/v1/health.proto` is vendored verbatim from
    # the canonical gRPC health-checking protocol so the Playwright
    # TS adapter can generate Connect-RPC bindings from it (the Go
    # and Python adapters consume their respective ecosystem
    # libraries directly). Buf's STANDARD lint rule set rejects the
    # canonical file's enum naming (`UNKNOWN`, `SERVING`, …) and
    # several other shape choices that predate buf's style. Lint
    # exemption keeps the file byte-identical to the gRPC source so
    # bindings stay interoperable. See ADR-0021 §6.
    lint:
      use:
        - STANDARD
      except:
        # The protocol exposes a single service named `Driver`. The
        # `*Service` suffix is redundant in this context and the
        # project prefers the shorter, semantically clearer name.
        - SERVICE_SUFFIX
      ignore:
        - proto/grpc

breaking:
  use:
    - FILE
  except:
    # `go_package` is codegen metadata, not a wire-format contract.
    # In our path-based versioning the Go import path mirrors the
    # proto package path (`spectre.driver.vN` →
    # `proto/gen/go/spectre/driver/vN`), so `FILE_SAME_PACKAGE`
    # already covers the meaningful contract. Exempting this rule
    # lets us evolve Go-specific generation knobs without forcing a
    # version bump. See ADR-0007.
    - FILE_SAME_GO_PACKAGE
