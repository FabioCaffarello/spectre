[project]
name = "spectre-conformance"
version = "0.1.0a0"
description = "Spectre Driver Protocol conformance test suite."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Fabio Caffarello", email = "fabio.caffarello@gmail.com" },
]
dependencies = [
    # Generated bindings for the Driver Protocol. Sourced from
    # `proto/gen/python` (gitignored, produced by
    # `just proto-generate`). See ADR-0007.
    "spectre-driver-protocol",
    # Conformance harness reads driver.yaml manifests.
    "pyyaml>=6.0",
    # gRPC client used by the harness. The runtime is also a transitive
    # dep of spectre-driver-protocol; declared here for clarity.
    "grpcio>=1.60",
    # Standard gRPC health checking. The harness polls
    # `grpc.health.v1.Health.Check` until SERVING as the readiness
    # signal (ADR-0021 §6); the same package is also a runtime dep
    # of the SeleniumBase adapter.
    "grpcio-health-checking>=1.60",
    # Redis client used by the R4.3 restart-invalidation conformance
    # test to inspect adapter session state directly. The test
    # harness dials the same Redis the adapter writes to and asserts
    # on the keyspace shape per ADR-0023 §4.
    "redis>=5.0",
    # Kafka consumer used by the R4.4 kafka-sink conformance test
    # to drain the topic the engine published to and assert
    # partition keys + headers (ADR-0023 §3 R4.4 addendum).
    "confluent-kafka>=2.5",
]

[project.urls]
Homepage = "https://github.com/FabioCaffarello/spectre"
Repository = "https://github.com/FabioCaffarello/spectre"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "types-protobuf>=4.24",
    "types-pyyaml>=6.0",
]

# This project is dev-tooling only; it is not packaged or installed.
[tool.uv]
package = false

[tool.uv.sources]
spectre-driver-protocol = { path = "../../proto/gen/python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src"]

# Generated protobuf modules are untyped. Treat them as Any-typed at
# the boundary; we re-annotate values pulled from the descriptor in
# source files.
[[tool.mypy.overrides]]
module = ["spectre.driver.v1alpha1.*", "spectre.engine.v1alpha1.*"]
ignore_missing_imports = true
follow_imports = "skip"

# `grpcio` ships without bundled type stubs. Treat the public API as
# Any-typed; the harness wraps it so leakage is bounded. `grpc_health`
# (from grpcio-health-checking) is the same story.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_health", "grpc_health.*"]
ignore_missing_imports = true

# redis-py: the bundled stubs surface every command as
# ``Awaitable[Any] | Any`` to accommodate the asyncio variant,
# which means the sync code path looks awaitable to mypy. Treat
# the boundary as Any-typed; the conformance test only does
# direct GET / DEL verification.
[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = true
follow_imports = "skip"

# confluent-kafka ships no type stubs; the conformance kafka
# test wraps it locally so the boundary is bounded.
[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
