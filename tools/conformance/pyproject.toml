[project]
name = "spectre-conformance"
version = "0.1.0a0"
description = "Spectre Driver Protocol conformance test suite."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Fabio Caffarello", email = "fabio.caffarello@gmail.com" },
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FabioCaffarello/spectre"
Repository = "https://github.com/FabioCaffarello/spectre"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

# This project is dev-tooling only; it is not packaged or installed.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
