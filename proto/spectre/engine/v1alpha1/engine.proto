// Internal Engine service contract.
//
// This protocol is the wire boundary between the control plane and
// the engine. It is `v1alpha1`: unstable and minimal. Adding fields
// (or new RPCs) is non-breaking; renaming or removing them is not.
//
// Unlike `spectre.driver.v1alpha1` (which is a public protocol
// adapter authors implement), this protocol is internal to the
// project — only the engine implements the server side, and only the
// control plane (R3.1) and tools that drive jobs end-to-end consume
// it.
//
// The protocol intentionally exposes a single streaming RPC. Job
// cancellation is achieved through gRPC stream cancellation.
// Status, metrics, and listing are control-plane responsibilities;
// the engine is stateless across calls in v1alpha1.

syntax = "proto3";

package spectre.engine.v1alpha1;

option go_package = "github.com/FabioCaffarello/spectre/proto/gen/go/spectre/engine/v1alpha1;enginev1alpha1";

// Engine accepts a Spectre DSL document and streams JSONL row events
// back as the executor produces them. The stream completes with a
// terminal `Completed` event on success or a `Failed` event on
// failure.
service Engine {
  rpc RunJob(RunJobRequest) returns (stream RunJobResponse);
}

message RunJobRequest {
  // Inline DSL document — the same YAML the legacy `spectre run`
  // CLI consumed. The engine parses, plans, resolves the requested
  // driver, dials the adapter, and runs the plan.
  string job_dsl = 1;

  // Optional client-supplied correlation id. Included in engine
  // logs and traces. The engine generates one if empty.
  string job_id = 2;

  // Output-sink kind selected by the control plane from the
  // ScrapeJob's `OutputSink` discriminated union (R3.2). Determines
  // whether the engine appends rows to the `job_rows` audit table
  // per ADR-0023 §2 — currently `'stdout'` writes audit rows;
  // `'kafka'`, `'s3'`, `'webhook'` skip the table to avoid
  // double-write costs. Empty defaults to `'stdout'` for backward
  // compatibility with clients that predate R4.2 (notably the
  // engine's own integration tests). Field 3 is reserved going
  // forward even if this field is later removed.
  string output_sink_kind = 3;

  // Kafka topic the engine publishes extracted rows to when
  // `output_sink_kind = 'kafka'` (R4.4 — ADR-0023 §3). Sourced
  // from `ScrapeJob.Spec.OutputSink.Kafka.Topic`. Ignored for
  // every other sink kind. Empty when the sink is not Kafka; an
  // empty topic with `output_sink_kind = 'kafka'` causes the
  // engine to yield a `Failed` event with `error_code =
  // "KAFKA_TOPIC_REQUIRED"`.
  //
  // R5.1 (ADR-0024 §3) introduces nested S3SinkConfig +
  // WebhookSinkConfig messages rather than flat fields; v1alpha2
  // may promote `kafka_topic` to a `KafkaSinkConfig` message for
  // symmetry but the field 4 wire format must stay R4.4-compatible.
  string kafka_topic = 4;

  // S3 sink config the engine consumes when `output_sink_kind =
  // 's3'` (R5.1 — ADR-0024 §3). Sourced from
  // `ScrapeJob.Spec.OutputSink.S3`. Ignored for every other
  // sink kind. Empty (default-valued message) when the sink is
  // not S3; an empty bucket / key with `output_sink_kind = 's3'`
  // causes the engine to yield a `Failed` event with
  // `error_code = "S3_FIELD_REQUIRED"`.
  S3SinkConfig s3 = 5;

  // Webhook sink config the engine consumes when
  // `output_sink_kind = 'webhook'` (R5.1 — ADR-0024 §4). Sourced
  // from `ScrapeJob.Spec.OutputSink.Webhook`. Ignored for every
  // other sink kind. An empty URL with `output_sink_kind =
  // 'webhook'` causes the engine to yield a `Failed` event with
  // `error_code = "WEBHOOK_FIELD_REQUIRED"`.
  WebhookSinkConfig webhook = 6;
}

// Per-job S3 sink configuration mirroring v1alpha2's
// `OutputSink.S3` shape. The reconciler extracts these fields
// from `ScrapeJob.Spec.OutputSink.S3` and forwards them on the
// `RunJobRequest.s3` field. The engine renders the key template
// (currently `{{.JobID}}`) at upload time per ADR-0024 §3.
message S3SinkConfig {
  // S3 bucket name. Non-empty when `output_sink_kind = 's3'`;
  // ignored for other sinks.
  string bucket = 1;

  // Object key, supports `{{.JobID}}` template substitution.
  // Non-empty when `output_sink_kind = 's3'`.
  string key = 2;

  // Optional endpoint URL override (MinIO, Cloudflare R2,
  // Wasabi, Backblaze B2). Empty for real AWS S3.
  string endpoint = 3;

  // AWS region. Empty falls back to the engine's
  // `SPECTRE_S3_REGION` default (`us-east-1`).
  string region = 4;
}

// Per-job webhook sink configuration mirroring v1alpha2's
// `OutputSink.Webhook` shape. The reconciler extracts these
// fields from `ScrapeJob.Spec.OutputSink.Webhook` and forwards
// them on the `RunJobRequest.webhook` field per ADR-0024 §4.
message WebhookSinkConfig {
  // Receiver URL.
  string url = 1;

  // HTTP method ("POST" or "PUT"). Empty defaults to POST.
  string method = 2;

  // Number of rows per HTTP request. 0 means one row per
  // request (the CRD default); >0 batches rows.
  int32 batch_size = 3;
}

message RunJobResponse {
  oneof event {
    // One JSONL row, encoded as the same string the legacy executor
    // wrote to stdout via the JSONL output sink. Preserves DSL
    // semantics so consumers that previously piped CLI stdout can
    // forward the line unchanged.
    Row row = 1;

    // Terminal: the plan ran to completion.
    Completed completed = 2;

    // Terminal: the plan failed mid-execution. No further events
    // follow.
    Failed failed = 3;
  }
}

message Row {
  string json_line = 1;
}

message Completed {
  int64 rows_extracted = 1;
}

message Failed {
  // Maps to the engine's `EngineError` taxonomy. Stable across
  // patch releases; new variants are additive.
  string error_code = 1;
  string error_message = 2;
}
