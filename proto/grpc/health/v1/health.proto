//
// The canonical health checking protocol. See
// https://github.com/grpc/grpc/blob/master/doc/health-checking.md.
//
// Vendored verbatim into the Spectre proto module so adapters that
// embed it (currently the Playwright TS adapter) can produce
// language-specific bindings via `just proto-generate`. The Go and
// Python adapters consume the protocol via their respective gRPC
// libraries' standard health-checking packages
// (`google.golang.org/grpc/health/grpc_health_v1` and
// `grpcio-health-checking`) and do not depend on the bindings
// generated from this file. ADR-0021 §6 makes the registration
// non-negotiable across all three adapters.

syntax = "proto3";

package grpc.health.v1;

option csharp_namespace = "Grpc.Health.V1";
option go_package = "google.golang.org/grpc/health/grpc_health_v1";
option java_multiple_files = true;
option java_outer_classname = "HealthProto";
option java_package = "io.grpc.health.v1";

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3; // Used only by the Watch method.
  }
  ServingStatus status = 1;
}

service Health {
  // Check checks the serving status of the named service. The
  // canonical contract is in the gRPC health checking spec linked
  // in the file header comment.
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);

  // Watch streams updates as the named service's serving status
  // transitions. The Spectre adapters do not subscribe via Watch;
  // the conformance harness polls Check until SERVING.
  rpc Watch(HealthCheckRequest) returns (stream HealthCheckResponse);
}
