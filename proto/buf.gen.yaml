# Code generation for the Driver Protocol.
#
# Output is written to `proto/gen/<lang>/`, which is gitignored.
# Regenerate locally or in CI; do not check generated code into the
# repository.
#
# This file is intentionally minimal. The Rust engine generates its
# bindings via tonic-build inside its crate, and the TypeScript
# Playwright adapter generates via its own buf invocation. Languages
# whose drivers do not yet live in this repository will be added here
# as they land.

version: v2

plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
