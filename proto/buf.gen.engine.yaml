# Code generation for the internal Engine protocol
# (`spectre.engine.v1alpha1`).
#
# Consumers (per R2.3 + R4.4):
#
#   - Rust: the engine itself. Generated by `engines/engine/build.rs`
#     at cargo build time; not produced here.
#   - Go: the control plane (R3.1, ADR-0019 §5).
#   - Python: the conformance suite's R4.4 kafka-sink test
#     (`tools/conformance/tests/test_kafka_sink.py`) needs to drive
#     a `RunJob` end-to-end. Adapter Python (SeleniumBase) does not
#     consume engine bindings — only the conformance suite does.
#
# TS bindings are intentionally not generated: the Playwright
# adapter does not consume the engine API. Keeping them out avoids
# dead code in that ecosystem.
#
# Run from the repository root via `just proto-generate`, which
# invokes `buf generate` first against the driver path with the
# default template (`buf.gen.yaml`) and then against the engine
# path with this template.

version: v2

plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # Python — same plugin pin as buf.gen.yaml's driver-protocol
  # generation so the gencode-runtime contract is identical.
  # Output lands in proto/gen/python alongside the driver bindings;
  # the conformance suite consumes both via the editable
  # `spectre-driver-protocol` source (which holds the entire
  # `proto/gen/python` tree).
  - remote: buf.build/protocolbuffers/python:v33.1
    out: gen/python

  - remote: buf.build/grpc/python:v1.74.0
    out: gen/python
