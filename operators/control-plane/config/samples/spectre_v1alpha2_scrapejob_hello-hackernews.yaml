# Sample ScrapeJob targeting the Playwright adapter. The inline DSL
# mirrors examples/hello-hackernews/job.yaml. The reconciler dials
# the engine resolved from spec.engineRef and streams JSONL rows to
# its stdout (visible via `kubectl logs <operator-pod>`).
#
# This sample assumes a `spectre-engine` Kubernetes Service in the
# `spectre-system` namespace exposing the engine's gRPC port (8090).
# Helm (R7.1) provisions that Service for in-cluster deployments.
# For the post-R6.3 Compose dev flow (where the engine runs as a
# Compose service rather than an in-cluster Pod), use
# spectre_v1alpha2_scrapejob_endpoint.yaml, which dials the
# Compose-internal `engine:8090` hostname directly.
apiVersion: spectre.io/v1alpha2
kind: ScrapeJob
metadata:
  name: hello-hackernews
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: playwright
    steps:
      - navigate: https://news.ycombinator.com
      - extract:
          selector: .titleline > a
          fields:
            title: textContent
            url: href
    output:
      format: jsonl
      path: ./stories.jsonl
  engineRef:
    service:
      name: spectre-engine
      namespace: spectre-system
      port: 8090
  outputSink:
    stdout: {}
