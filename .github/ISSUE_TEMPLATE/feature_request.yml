name: Feature Request
description: Propose a new capability for Spectre.
title: "[Feature] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        For non-trivial changes, this issue is the starting point. The
        maintainers may ask for an Architecture Decision Record before
        accepting the change. See `docs/adr/`.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve, and who feels the pain today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Core (engine, control plane)
        - Protocol (driver schema, capabilities)
        - Adapter (Playwright, SeleniumBase, curl-impersonate, other)
        - Tooling (CLI, conformance, intelligence layer)
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: adr
    attributes:
      label: Architecture Decision Record
      options:
        - label: I am willing to author an ADR for this change.
