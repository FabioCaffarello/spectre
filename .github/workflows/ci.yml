name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      operator: ${{ steps.filter.outputs.operator }}
      image_engine: ${{ steps.filter.outputs.image_engine }}
      image_control_plane: ${{ steps.filter.outputs.image_control_plane }}
      image_curl_impersonate: ${{ steps.filter.outputs.image_curl_impersonate }}
      image_playwright: ${{ steps.filter.outputs.image_playwright }}
      image_seleniumbase: ${{ steps.filter.outputs.image_seleniumbase }}
      full_stack: ${{ steps.filter.outputs.full_stack }}
      publish_dry_run: ${{ steps.filter.outputs.publish_dry_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'engines/engine/**'
              - '.github/workflows/ci.yml'
            go:
              # operators/control-plane has its own `operator` job (the
              # kubebuilder Makefile owns lint/test via envtest);
              # only adapters/curl-impersonate remains in this matrix.
              - 'adapters/curl-impersonate/**'
              - '.github/workflows/ci.yml'
            operator:
              # operators/control-plane is a kubebuilder v4 operator whose
              # tests need envtest binaries (apiserver + etcd +
              # kubectl). The dedicated job below drives `make test`
              # and `make build`. See ADR-0019.
              - 'operators/control-plane/**'
              - '.github/workflows/ci.yml'
            typescript:
              - 'adapters/playwright/**'
              - '.github/workflows/ci.yml'
            python:
              - 'adapters/seleniumbase/**'
              - 'tools/conformance/**'
              # Conformance tests launch the Playwright adapter as a
              # subprocess; a TS-only change must still re-run them.
              - 'adapters/playwright/**'
              # The conformance suite also exercises the Go
              # curl-impersonate adapter via a built binary, so a
              # change in adapters/curl-impersonate/** must re-run
              # the Python conformance job too.
              - 'adapters/curl-impersonate/**'
              - '.github/workflows/ci.yml'
            # Per-image rebuild filters (R6.5.2). Each target rebuilds
            # when its source, the proto schema, the bake config, the
            # toolchain pins, the per-Dockerfile ignore, or the
            # workflow changes. The `images` matrix job below consumes
            # these via its `if:` gate; matrix-entry `if:` reads the
            # corresponding output to skip unchanged targets while
            # still listing them in the run UI.
            image_engine:
              - 'engines/engine/**'
              - 'engines/engine/.dockerignore'
              - 'proto/**'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - '.github/workflows/ci.yml'
            image_control_plane:
              - 'operators/control-plane/**'
              - 'operators/control-plane/.dockerignore'
              - 'proto/**'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - '.github/workflows/ci.yml'
            image_curl_impersonate:
              - 'adapters/curl-impersonate/**'
              - 'adapters/curl-impersonate/.dockerignore'
              - 'proto/**'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - '.github/workflows/ci.yml'
            image_playwright:
              - 'adapters/playwright/**'
              - 'adapters/playwright/.dockerignore'
              - 'proto/**'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - '.github/workflows/ci.yml'
            image_seleniumbase:
              - 'adapters/seleniumbase/**'
              - 'adapters/seleniumbase/.dockerignore'
              - 'proto/**'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - '.github/workflows/ci.yml'
            # Full-stack gate (R6.5.2). Triggers on anything that could
            # break the unified Compose flow — service source, proto,
            # Compose YAML, bake, build pins, kind config, sample CRs
            # / CRDs, or the workflow itself.
            full_stack:
              - 'engines/**'
              - 'operators/**'
              - 'adapters/**'
              - 'proto/**'
              - 'docker-compose.yml'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - 'build/kind/**'
              - 'operators/control-plane/config/samples/**'
              - 'operators/control-plane/config/crd/**'
              - '.github/workflows/ci.yml'
            # Publish dry-run gate (R6.5.3). Triggers on anything
            # that affects the publish path — any Dockerfile, the
            # bake config, the toolchain pins, the publish workflow
            # itself, or the CI workflow. The dry-run job below
            # builds multi-arch where supported (control-plane +
            # playwright) without `--push` or `--load`, validating
            # the publish workflow's build path is sound. CI is
            # the only consumer; the actual publish runs via
            # `.github/workflows/publish.yml` workflow_dispatch.
            publish_dry_run:
              - 'engines/**/Dockerfile'
              - 'operators/**/Dockerfile'
              - 'adapters/**/Dockerfile'
              - 'docker-bake.hcl'
              - 'build/docker/**'
              - '.github/workflows/publish.yml'
              - '.github/workflows/ci.yml'

  proto:
    name: Protobuf
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Version-coherence gate: every PR runs through this job (the
      # `proto` filter matches `.github/workflows/ci.yml`), so the
      # cheapest place to fail fast on a versions.env <-> Dockerfile
      # ARG drift is here. R6.5.2 may promote this into its own job.
      - name: Check toolchain-pin coherence
        run: bash tools/build/check-versions-coherent.sh
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: buf lint
      - name: Format check
        run: buf format --diff --exit-code
      - name: Build
        run: buf build

  rust:
    name: Rust (engine)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rdkafka-sys vendors librdkafka and compiles it via cmake. Its
      # CMakeLists includes <curl/curl.h> regardless of the
      # `-DWITH_CURL=0` flag the crate's build script passes, so the
      # runner needs libcurl headers on PATH for the C build to
      # succeed.
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      # tonic-build invokes prost-build, which requires a protoc
      # binary on PATH. The Rust build script (`build.rs`) runs as
      # part of every cargo invocation below, so protoc must be
      # available before any of them. See ADR-0007.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/engine
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release
      # The R2.3 binary is service-only (`run`/`validate`/`version`
      # subcommands retired with the CLI surface — ADR-0020 §3). The
      # equivalent smoke is "the release binary exists and is
      # executable"; deeper service-mode smokes that bind a port and
      # probe `grpc.health.v1.Health` belong in the engine-image job
      # below where a port can be mapped without colliding with the
      # GitHub runner.
      - name: spectre binary built
        run: test -x ./target/release/spectre

  go:
    name: Go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/curl-impersonate
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Pin to the version declared in our go.mod files. Using
          # `stable` picks up newer toolchains whose modules can
          # contain build-constrained source that golangci-lint's
          # bundled type-checker (built against an older Go) cannot
          # parse. The curl-impersonate adapter's go.mod requires
          # Go 1.25 (matches the control-plane operator's track).
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the protocol bindings before any Go invocation. The
      # Go consumer modules resolve `proto/gen/go` via a local
      # `replace` directive (see ADR-0007); without this step the
      # downstream `go vet`/`go test`/`go build` would fail.
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to a version built with the same Go toolchain as our
          # modules target (go 1.24+). v1.62 was built with go 1.23 and
          # refuses configs whose `go` directive is newer.
          version: latest
          working-directory: ${{ matrix.module }}
      - name: Test
        run: go test ./...
      - name: Build
        # Verify every package compiles without writing binaries to the
        # working tree.
        run: go build -o /dev/null ./...

  typescript:
    name: TypeScript (playwright adapter)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/playwright
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: adapters/playwright/pnpm-lock.yaml
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the TypeScript bindings before tsc/vitest/prettier
      # see the source tree (see ADR-0007).
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - adapters/seleniumbase
          - tools/conformance
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    # All three adapters (Playwright, SeleniumBase, curl-impersonate)
    # ping Redis at startup as a health check (Redis session
    # externalization landed in 1479e3a / 4077d81). The conformance
    # suite launches each adapter as a subprocess and dials it over
    # gRPC; without a reachable Redis the adapters exit before
    # reporting health, surfacing as 56 `HarnessFailure: driver
    # subprocess exited before reporting health` errors. Pinned to
    # `redis:7-alpine` for parity with `docker-compose.yml`. The
    # service applies to both matrix entries; the seleniumbase entry
    # ignores it.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The conformance suite launches the Playwright adapter as a
      # subprocess and dials it over gRPC (see ADR-0008). Node + pnpm
      # are required to build that adapter; the SeleniumBase package
      # has no such dependency, so we install them only when needed.
      - if: matrix.package == 'tools/conformance'
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - if: matrix.package == 'tools/conformance'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: adapters/playwright/pnpm-lock.yaml
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the Python bindings before `uv sync` resolves the
      # `spectre-driver-protocol` editable source. Post-generate
      # silently skips the Go module init when `go` is not on PATH
      # (this job does not install Go); see ADR-0007.
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Build the Playwright adapter so the conformance fixture can
      # find `dist/index.js`. The pnpm step here also verifies the
      # adapter still builds in the configuration the conformance
      # tests actually exercise.
      - if: matrix.package == 'tools/conformance'
        name: Build Playwright adapter
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Conformance tests that exercise `Navigate` need a real
      # Chromium binary. The cache key is derived from the resolved
      # Playwright version in the lockfile so a dependency bump
      # invalidates the cache automatically. See ADR-0009.
      - if: matrix.package == 'tools/conformance'
        name: Resolve Playwright version
        id: pw-version
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: matrix.package == 'tools/conformance'
        name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: matrix.package == 'tools/conformance' && steps.pw-cache.outputs.cache-hit != 'true'
        name: Install Chromium with system deps
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.package == 'tools/conformance' && steps.pw-cache.outputs.cache-hit == 'true'
        name: Install Chromium system deps (browser already cached)
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: pnpm exec playwright install-deps chromium
      # The conformance suite also exercises the SeleniumBase adapter
      # (ADR-0014). Bootstrap its uv-managed virtualenv (which has
      # seleniumbase + grpcio + spectre-driver-protocol), install
      # Google Chrome, and call SeleniumBase's chromedriver installer
      # so `Driver()` resolves both binaries on the first Navigate.
      - if: matrix.package == 'tools/conformance'
        name: Bootstrap SeleniumBase adapter
        working-directory: ${{ github.workspace }}/adapters/seleniumbase
        run: uv sync --all-extras --dev
      - if: matrix.package == 'tools/conformance'
        name: Install Google Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - if: matrix.package == 'tools/conformance'
        name: Install ChromeDriver via SeleniumBase
        working-directory: ${{ github.workspace }}/adapters/seleniumbase
        run: .venv/bin/python -m seleniumbase install chromedriver
      # The conformance suite also exercises the Go curl-impersonate
      # adapter (ADR-0016). Set up Go, build the adapter binary, and
      # download the pinned curl-impersonate release tarball so
      # `curl_chrome116` is on PATH when the conformance suite runs.
      - if: matrix.package == 'tools/conformance'
        uses: actions/setup-go@v6
        with:
          # Match the curl-impersonate adapter's go.mod (1.25).
          go-version: "1.25"
      - if: matrix.package == 'tools/conformance'
        name: Build curl-impersonate adapter
        working-directory: ${{ github.workspace }}/adapters/curl-impersonate
        run: go build -o bin/adapter ./cmd/adapter
      # Pin the curl-impersonate release. Bumping this version is a
      # PR-sized change because different fingerprints can produce
      # different test outcomes against fingerprint-sensitive sites.
      # The conformance tests target a local HTTP fixture so the
      # fingerprint itself is not asserted, but pinning keeps CI
      # determinism. ADR-0016 §1.
      #
      # Read VERSION + SHA256 from the pin file shared with the
      # curl-impersonate adapter image
      # (`adapters/curl-impersonate/.curl-impersonate-version`) so
      # the adapter image runtime and the conformance suite stay
      # on the same release. Single source of truth.
      - if: matrix.package == 'tools/conformance'
        id: curl-imp-pin
        name: Resolve curl-impersonate pin (conformance)
        # Override the job-level `defaults.run.working-directory:
        # ${{ matrix.package }}` so the relative pin-file path
        # resolves at the repo root, not inside `tools/conformance/`.
        working-directory: ${{ github.workspace }}
        run: |
          read -r version sha256 < <(grep -v '^#' adapters/curl-impersonate/.curl-impersonate-version | head -n 1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
      - if: matrix.package == 'tools/conformance'
        name: Cache curl-impersonate release
        id: curl-imp-cache
        uses: actions/cache@v5
        with:
          path: /opt/curl-impersonate
          key: curl-impersonate-${{ runner.os }}-${{ steps.curl-imp-pin.outputs.version }}
      - if: matrix.package == 'tools/conformance' && steps.curl-imp-cache.outputs.cache-hit != 'true'
        name: Download curl-impersonate
        run: |
          set -eux
          version="${{ steps.curl-imp-pin.outputs.version }}"
          sha256="${{ steps.curl-imp-pin.outputs.sha256 }}"
          url="https://github.com/lwthiker/curl-impersonate/releases/download/v${version}/curl-impersonate-v${version}.x86_64-linux-gnu.tar.gz"
          curl -fsSL "${url}" -o /tmp/curl-impersonate.tgz
          echo "${sha256}  /tmp/curl-impersonate.tgz" | sha256sum -c -
          sudo mkdir -p /opt/curl-impersonate
          sudo tar -xzf /tmp/curl-impersonate.tgz -C /opt/curl-impersonate
      - if: matrix.package == 'tools/conformance'
        name: Add curl-impersonate to PATH
        run: echo "/opt/curl-impersonate" >> "$GITHUB_PATH"
      - run: uv run pytest

  operator:
    name: Operator (control-plane envtest + build)
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operators/control-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Match the toolchain kubebuilder v4 scaffolds in go.mod.
          # The control-plane is on its own track.
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the protocol bindings before `make test` /
      # `make build`. The control-plane resolves
      # `github.com/FabioCaffarello/spectre/proto/gen/go` via a local
      # `replace` directive (see ADR-0007); without this step
      # `controller-gen` (invoked by `make manifests`, transitively
      # `make test`) fails resolving the import.
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      # The kubebuilder Makefile vendors its own controller-gen,
      # kustomize, setup-envtest and golangci-lint into bin/, then
      # `make test` downloads apiserver/etcd/kubectl via setup-envtest.
      # Cache the bin/ directory so subsequent CI runs skip those
      # downloads. The cache key is keyed on go.sum so a controller-
      # runtime bump invalidates the cache automatically.
      - name: Cache kubebuilder tool chain
        uses: actions/cache@v5
        with:
          path: operators/control-plane/bin
          key: kubebuilder-bin-${{ runner.os }}-${{ hashFiles('operators/control-plane/go.sum') }}
      - name: Run tests
        run: make test
      - name: Build
        run: make build

  # Matrix image build + smoke (R6.5.2). Replaces the ad-hoc
  # `engine-image` and `operator-image` jobs by routing every image
  # build through the same `docker buildx bake` invocation that
  # `just images` uses locally. Five matrix entries (one per bake
  # target); per-entry `if: matrix.changed == 'true'` preserves
  # selectivity. Legacy jobs run alongside until the next commit
  # deletes them.
  images:
    name: Image (build + smoke) — ${{ matrix.target }}
    needs: changes
    # Job-level gate fires when at least one image's filter matched.
    # Per-step gates (matrix.changed) skip unchanged targets within
    # the dispatched matrix.
    if: |
      needs.changes.outputs.image_engine == 'true' ||
      needs.changes.outputs.image_control_plane == 'true' ||
      needs.changes.outputs.image_curl_impersonate == 'true' ||
      needs.changes.outputs.image_playwright == 'true' ||
      needs.changes.outputs.image_seleniumbase == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `include:` form — each entry carries `target` (bake target),
      # `changed` (per-target gate), `smoke_recipe` (just recipe
      # name). The smoke recipe names aren't a uniform suffix
      # transform of the target name (`op-image-smoke` vs
      # `engine-image-run`), so a plain `target:` axis is not
      # enough.
      matrix:
        include:
          - target: engine
            changed: ${{ needs.changes.outputs.image_engine }}
            smoke_recipe: engine-image-run
          - target: control-plane
            changed: ${{ needs.changes.outputs.image_control_plane }}
            smoke_recipe: op-image-smoke
          - target: curl-impersonate
            changed: ${{ needs.changes.outputs.image_curl_impersonate }}
            smoke_recipe: curl-imp-image-smoke
          - target: playwright
            changed: ${{ needs.changes.outputs.image_playwright }}
            smoke_recipe: pw-image-smoke
          - target: seleniumbase
            changed: ${{ needs.changes.outputs.image_seleniumbase }}
            smoke_recipe: sb-image-smoke
    steps:
      - uses: actions/checkout@v6
      - if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v4
      - if: matrix.changed == 'true'
        uses: extractions/setup-just@v3
      # The bake invocation matches `just images` byte-for-byte:
      # source the toolchain pins from versions.env, then call
      # `docker buildx bake --load <target>`. CI sets VCS_REF /
      # BUILD_DATE / TAG=ci so the OCI labels are populated and
      # the resulting image is tagged distinctly from local
      # `:dev` artefacts.
      - name: Build ${{ matrix.target }}
        if: matrix.changed == 'true'
        env:
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          TAG: ci
        run: |
          set -a
          source build/docker/versions.env
          set +a
          docker buildx bake --load ${{ matrix.target }}
      - name: Smoke ${{ matrix.target }}
        if: matrix.changed == 'true'
        # `TAG` is the recipe's first positional parameter (default
        # `dev`); pass `ci` as the value, not the literal `TAG=ci`.
        run: just ${{ matrix.smoke_recipe }} ci
      - name: Report image size
        if: matrix.changed == 'true'
        run: docker images "spectre-${{ matrix.target }}:ci" --format '{{.Repository}}:{{.Tag}}\t{{.Size}}'

  # Full-stack gate (R6.5.2 — verifies master strategy §2.5
  # "Compose is the development environment" in CI). Runs the
  # post-R6.3 unified flow end-to-end: bake builds the five
  # images, Compose brings up the eleven services, kind provides
  # the Kubernetes API the operator dials, the v1alpha2 CRD is
  # installed, and the hello-hackernews sample ScrapeJob is
  # asserted to reach `Completed`. The 5-minute Completed-poll
  # absorbs CI cold-start; the local flow finishes the same
  # ScrapeJob in well under a minute.
  full-stack:
    name: Full-stack gate (compose + kind + sample ScrapeJob)
    needs: [changes, images]
    if: needs.changes.outputs.full_stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: extractions/setup-just@v3
      - uses: actions/setup-go@v6
        with:
          # Match the toolchain kubebuilder v4 scaffolds in go.mod;
          # `make install` invokes controller-gen.
          go-version: "1.25"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the protocol bindings before `make install`
      # (which transitively runs `make manifests` →
      # `controller-gen`). The control-plane resolves
      # `github.com/FabioCaffarello/spectre/proto/gen/go` via a
      # local `replace` directive (see ADR-0007).
      - name: Generate protocol bindings
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      # Build the five images at TAG=dev so docker-compose.yml's
      # `image: spectre-<name>:dev` references resolve without
      # re-tagging. Local-flow byte-for-byte parity (just images).
      - name: Build images via bake
        env:
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          TAG: dev
        run: |
          set -a
          source build/docker/versions.env
          set +a
          docker buildx bake --load
      # Spin up the kind cluster on the runner's Docker daemon.
      # `cluster_name: spectre-ci` overrides build/kind/cluster.yaml's
      # `name:` so the runner's daemon doesn't collide with a
      # `spectre-dev` from a parallel job. helm/kind-action exports
      # KUBECONFIG to the runner; subsequent kubectl calls work
      # without extra setup.
      - uses: helm/kind-action@v1
        with:
          cluster_name: spectre-ci
          config: build/kind/cluster.yaml
      - name: Sanity-check kind cluster
        run: kubectl get nodes -o wide
      # Regenerate kubeconfig with --internal so the operator
      # container — which joins the `kind` Docker network — can
      # reach the API server at `spectre-ci-control-plane:6443`
      # (kind names the API node `<cluster>-control-plane`). The
      # runner's host-side kubectl keeps its own KUBECONFIG from
      # helm/kind-action; the operator reads the file mounted at
      # /home/nonroot/.kube/config.
      - name: Generate operator kubeconfig (--internal)
        run: |
          mkdir -p build/kind
          kind get kubeconfig --name spectre-ci --internal \
            > build/kind/kubeconfig
      # docker-compose.yml's `control-plane` service hardcodes the
      # in-DinD URL `spectre-dev-control-plane:6443` (the
      # cluster-name suffix is baked into the kubeconfig, not the
      # Compose env). CI's kind cluster is named `spectre-ci`, so
      # the kubeconfig's server URL resolves at
      # `spectre-ci-control-plane:6443` — the operator follows the
      # kubeconfig, not the Compose env, so this works without
      # touching docker-compose.yml.
      - name: Bring up Compose stack (--profile full)
        run: |
          docker compose --profile full up -d
          docker compose ps
      - name: Wait for Compose services to start
        run: |
          # Compose reports `running` when each container is up.
          # The engine has no Compose healthcheck (ADR-0025 §3 —
          # distroless ships no probe binary), so we count
          # `running` services rather than `healthy`. Eleven
          # services on `--profile full` (minio-bootstrap exits
          # `service_completed_successfully` and is not running).
          timeout 120 bash -c '
            until [ "$(docker compose ps --status running --format json | jq -s "length")" -ge 10 ]; do
              docker compose ps
              sleep 5
            done
          '
          docker compose ps
      - name: Apply v1alpha2 CRDs to kind
        working-directory: operators/control-plane
        run: make install
      - name: Apply hello-hackernews-endpoint sample ScrapeJob
        # The hello-hackernews.yaml sample uses
        # `engineRef.service.name=spectre-engine, namespace=spectre-system,
        # port=8090`, which the operator resolves to
        # `spectre-engine.spectre-system.svc.cluster.local:8090` — a
        # K8s Service that only exists when the engine runs in-cluster
        # (Helm path, R7.1). The CI full-stack test runs the engine
        # as a Compose service alongside the operator, so we use the
        # endpoint-form sample which dials `engine:8090` directly via
        # Compose's DNS (the same flow `compose up` exercises locally).
        run: kubectl apply -f operators/control-plane/config/samples/spectre_v1alpha2_scrapejob_endpoint.yaml
      - name: Wait for ScrapeJob phase=Completed (or Failed)
        run: |
          # The endpoint-form sample's resource is named
          # `hello-hackernews-endpoint`. Locally the job finishes in
          # well under a minute; 5 minutes absorbs CI cold-start image
          # pulls and slow runners. Fail-fast on terminal Failed so the
          # job surfaces a real diagnosis instead of a 5-min timeout
          # the next reader has to debug.
          timeout 300 bash -c '
            while :; do
              phase=$(kubectl get scrapejob hello-hackernews-endpoint -o jsonpath={.status.phase} 2>/dev/null)
              kubectl get scrapejob hello-hackernews-endpoint 2>/dev/null || true
              case "$phase" in
                Completed) exit 0 ;;
                Failed)    echo "ScrapeJob terminal Failed"; exit 1 ;;
              esac
              sleep 5
            done
          '
          kubectl describe scrapejob hello-hackernews-endpoint
      - name: Operator logs (always)
        if: always()
        run: docker compose logs control-plane | tail -200 || true
      - name: Engine logs (always)
        if: always()
        run: docker compose logs engine | tail -200 || true
      - name: Adapter logs (always)
        if: always()
        run: |
          docker compose logs playwright-adapter | tail -100 || true
          docker compose logs seleniumbase-adapter | tail -100 || true
          docker compose logs curl-impersonate-adapter | tail -100 || true
      - name: Compose stack down (cleanup)
        if: always()
        run: docker compose --profile full down -v || true

  # Publish dry-run (R6.5.3). Validates that the multi-arch
  # publish path works without actually pushing to Docker Hub. The
  # actual publish runs via `.github/workflows/publish.yml`
  # (workflow_dispatch). control-plane and playwright build
  # linux/amd64 + linux/arm64 manifest lists; the other three
  # build linux/amd64 only per the deferral list in ADR-0018 §5
  # R6.5.3 update. No `--load` (multi-arch can't load into a
  # single-arch local daemon); no `--push` (no Docker Hub
  # credentials in CI). Build artefacts live in BuildKit's local
  # cache and are discarded with the runner.
  publish-dry-run:
    name: Publish dry-run (build + manifest check, no push)
    needs: changes
    if: needs.changes.outputs.publish_dry_run == 'true'
    runs-on: ubuntu-latest
    # Multi-arch (linux/amd64 + linux/arm64) builds for control-plane
    # and playwright go through QEMU emulation on the runner; the
    # 30-min budget proved too tight (the bake step alone consumed
    # the full window). 45 min absorbs the playwright Chromium
    # rebuild on a cold cache without leaving large headroom.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Bake build (multi-arch where supported, no push)
        env:
          REGISTRY: fabiocaffarello
          TAG: ci-dry-run
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
        run: |
          set -a
          source build/docker/versions.env
          set +a
          # Two `--set` per target (one per platform) renders
          # platforms as a proper list under `bake --print`; the
          # comma-joined form is documented but renders ambiguously.
          docker buildx bake \
            --set control-plane.platform=linux/amd64 \
            --set control-plane.platform=linux/arm64 \
            --set playwright.platform=linux/amd64 \
            --set playwright.platform=linux/arm64

  ci-summary:
    name: CI summary
    if: always()
    needs: [changes, proto, rust, go, typescript, python, operator, images, full-stack, publish-dry-run]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "proto:                ${{ needs.proto.result }}"
          echo "rust:                 ${{ needs.rust.result }}"
          echo "go:                   ${{ needs.go.result }}"
          echo "typescript:           ${{ needs.typescript.result }}"
          echo "python:               ${{ needs.python.result }}"
          echo "operator:             ${{ needs.operator.result }}"
          echo "images:               ${{ needs.images.result }}"
          echo "full-stack:           ${{ needs.full-stack.result }}"
          echo "publish-dry-run:      ${{ needs.publish-dry-run.result }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
