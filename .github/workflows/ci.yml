name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      operator: ${{ steps.filter.outputs.operator }}
      engine_image: ${{ steps.filter.outputs.engine_image }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'core/engine/**'
              - '.github/workflows/ci.yml'
            go:
              # PR14: core/control-plane moved to its own `operator`
              # job because the kubebuilder Makefile owns lint/test
              # via envtest. Only adapters/curl-impersonate remains in
              # this matrix.
              - 'adapters/curl-impersonate/**'
              - '.github/workflows/ci.yml'
            operator:
              # PR14: core/control-plane is a kubebuilder v4 operator
              # whose tests need envtest binaries (apiserver + etcd +
              # kubectl). The dedicated job below drives `make test`
              # and `make build`. See ADR-0019.
              - 'core/control-plane/**'
              - '.github/workflows/ci.yml'
            typescript:
              - 'adapters/playwright/**'
              - '.github/workflows/ci.yml'
            python:
              - 'adapters/seleniumbase/**'
              - 'tools/conformance/**'
              # Conformance tests launch the Playwright adapter as a
              # subprocess; a TS-only change must still re-run them.
              - 'adapters/playwright/**'
              # PR11: the conformance suite also exercises the Go
              # curl-impersonate adapter via a built binary, so a
              # change in adapters/curl-impersonate/** must re-run
              # the Python conformance job too.
              - 'adapters/curl-impersonate/**'
              - '.github/workflows/ci.yml'
            engine_image:
              # PR13: rebuild the engine Docker image whenever the
              # engine, the protocol schema, the Dockerfile, the
              # build-context exclusions, or the workflow changes.
              # See ADR-0018 §5 on why this job is build+run only,
              # not push.
              - 'core/engine/**'
              - 'proto/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  proto:
    name: Protobuf
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: buf lint
      - name: Format check
        run: buf format --diff --exit-code
      - name: Build
        run: buf build

  rust:
    name: Rust (engine)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/engine
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # tonic-build invokes prost-build, which requires a protoc
      # binary on PATH. The Rust build script (`build.rs`) runs as
      # part of every cargo invocation below, so protoc must be
      # available before any of them. See ADR-0007.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/engine
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release
      # Smoke tests for the spectre binary (ADR-0013). Both subcommands
      # are subprocess-free, so they run on the unit-test CI job without
      # needing the Playwright/Chromium toolchain that the engine
      # integration job carries.
      - name: spectre version
        run: ./target/release/spectre version
      - name: spectre validate
        run: ./target/release/spectre validate ../../examples/hello-hackernews/job.yaml

  go:
    name: Go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - adapters/curl-impersonate
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Pin to the version declared in our go.mod files. Using
          # `stable` picks up newer toolchains whose modules can
          # contain build-constrained source that golangci-lint's
          # bundled type-checker (built against an older Go) cannot
          # parse.
          go-version: "1.24"
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the protocol bindings before any Go invocation. The
      # Go consumer modules resolve `proto/gen/go` via a local
      # `replace` directive (see ADR-0007); without this step the
      # downstream `go vet`/`go test`/`go build` would fail.
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to a version built with the same Go toolchain as our
          # modules target (go 1.24+). v1.62 was built with go 1.23 and
          # refuses configs whose `go` directive is newer.
          version: latest
          working-directory: ${{ matrix.module }}
      - name: Test
        run: go test ./...
      - name: Build
        # Verify every package compiles without writing binaries to the
        # working tree.
        run: go build -o /dev/null ./...

  typescript:
    name: TypeScript (playwright adapter)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapters/playwright
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: adapters/playwright/pnpm-lock.yaml
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the TypeScript bindings before tsc/vitest/prettier
      # see the source tree (see ADR-0007).
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    name: Python (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - adapters/seleniumbase
          - tools/conformance
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The conformance suite launches the Playwright adapter as a
      # subprocess and dials it over gRPC (see ADR-0008). Node + pnpm
      # are required to build that adapter; the SeleniumBase package
      # has no such dependency, so we install them only when needed.
      - if: matrix.package == 'tools/conformance'
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - if: matrix.package == 'tools/conformance'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: adapters/playwright/pnpm-lock.yaml
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Generate the Python bindings before `uv sync` resolves the
      # `spectre-driver-protocol` editable source. Post-generate
      # silently skips the Go module init when `go` is not on PATH
      # (this job does not install Go); see ADR-0007.
      - name: Generate protocol bindings
        working-directory: ${{ github.workspace }}
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Build the Playwright adapter so the conformance fixture can
      # find `dist/index.js`. The pnpm step here also verifies the
      # adapter still builds in the configuration the conformance
      # tests actually exercise.
      - if: matrix.package == 'tools/conformance'
        name: Build Playwright adapter
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Conformance tests that exercise `Navigate` need a real
      # Chromium binary. The cache key is derived from the resolved
      # Playwright version in the lockfile so a dependency bump
      # invalidates the cache automatically. See ADR-0009.
      - if: matrix.package == 'tools/conformance'
        name: Resolve Playwright version
        id: pw-version
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: matrix.package == 'tools/conformance'
        name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: matrix.package == 'tools/conformance' && steps.pw-cache.outputs.cache-hit != 'true'
        name: Install Chromium with system deps
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.package == 'tools/conformance' && steps.pw-cache.outputs.cache-hit == 'true'
        name: Install Chromium system deps (browser already cached)
        working-directory: ${{ github.workspace }}/adapters/playwright
        run: pnpm exec playwright install-deps chromium
      # The conformance suite also exercises the SeleniumBase adapter
      # (ADR-0014). Bootstrap its uv-managed virtualenv (which has
      # seleniumbase + grpcio + spectre-driver-protocol), install
      # Google Chrome, and call SeleniumBase's chromedriver installer
      # so `Driver()` resolves both binaries on the first Navigate.
      - if: matrix.package == 'tools/conformance'
        name: Bootstrap SeleniumBase adapter
        working-directory: ${{ github.workspace }}/adapters/seleniumbase
        run: uv sync --all-extras --dev
      - if: matrix.package == 'tools/conformance'
        name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - if: matrix.package == 'tools/conformance'
        name: Install ChromeDriver via SeleniumBase
        working-directory: ${{ github.workspace }}/adapters/seleniumbase
        run: .venv/bin/python -m seleniumbase install chromedriver
      # The conformance suite also exercises the Go curl-impersonate
      # adapter (ADR-0016). Set up Go, build the adapter binary, and
      # download the pinned curl-impersonate release tarball so
      # `curl_chrome116` is on PATH when the conformance suite runs.
      - if: matrix.package == 'tools/conformance'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - if: matrix.package == 'tools/conformance'
        name: Build curl-impersonate adapter
        working-directory: ${{ github.workspace }}/adapters/curl-impersonate
        run: go build -o bin/adapter ./cmd/adapter
      # Pin the curl-impersonate release. Bumping this version is a
      # PR-sized change because different fingerprints can produce
      # different test outcomes against fingerprint-sensitive sites.
      # The conformance tests target a local HTTP fixture so the
      # fingerprint itself is not asserted, but pinning keeps CI
      # determinism. ADR-0016 §1.
      #
      # PR18 §4.1: read VERSION + SHA256 from the pin file shared
      # with the operator image (`adapters/curl-impersonate/.curl-impersonate-version`)
      # so the operator-image runtime and the conformance suite stay
      # on the same release. Single source of truth.
      - if: matrix.package == 'tools/conformance'
        id: curl-imp-pin
        name: Resolve curl-impersonate pin (conformance)
        run: |
          read -r version sha256 < <(grep -v '^#' adapters/curl-impersonate/.curl-impersonate-version | head -n 1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
      - if: matrix.package == 'tools/conformance'
        name: Cache curl-impersonate release
        id: curl-imp-cache
        uses: actions/cache@v4
        with:
          path: /opt/curl-impersonate
          key: curl-impersonate-${{ runner.os }}-${{ steps.curl-imp-pin.outputs.version }}
      - if: matrix.package == 'tools/conformance' && steps.curl-imp-cache.outputs.cache-hit != 'true'
        name: Download curl-impersonate
        run: |
          set -eux
          version="${{ steps.curl-imp-pin.outputs.version }}"
          sha256="${{ steps.curl-imp-pin.outputs.sha256 }}"
          url="https://github.com/lwthiker/curl-impersonate/releases/download/v${version}/curl-impersonate-v${version}.x86_64-linux-gnu.tar.gz"
          curl -fsSL "${url}" -o /tmp/curl-impersonate.tgz
          echo "${sha256}  /tmp/curl-impersonate.tgz" | sha256sum -c -
          sudo mkdir -p /opt/curl-impersonate
          sudo tar -xzf /tmp/curl-impersonate.tgz -C /opt/curl-impersonate
      - if: matrix.package == 'tools/conformance'
        name: Add curl-impersonate to PATH
        run: echo "/opt/curl-impersonate" >> "$GITHUB_PATH"
      - run: uv run pytest

  engine-integration:
    name: Engine integration (rust + playwright)
    needs: changes
    # Run when either the engine or the Playwright adapter changes.
    # Kept separate from the fast `rust` job: this one builds the
    # Playwright adapter and installs Chromium, which the unit-test
    # job has no business doing. See ADR-0012 §"Bad, because" on the
    # gating choice.
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: adapters/playwright/pnpm-lock.yaml
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/engine
      - name: Generate protocol bindings
        run: |
          cd proto && buf generate
          cd "$GITHUB_WORKSPACE" && bash tools/codegen/post-generate.sh
      - name: Build Playwright adapter
        working-directory: adapters/playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Resolve Playwright version
        id: pw-version
        working-directory: adapters/playwright
        run: |
          version=$(node -p "require('playwright/package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        name: Install Chromium with system deps
        working-directory: adapters/playwright
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        name: Install Chromium system deps (browser already cached)
        working-directory: adapters/playwright
        run: pnpm exec playwright install-deps chromium
      - name: Run engine integration test
        working-directory: core/engine
        env:
          PLAYWRIGHT_AVAILABLE: "1"
        run: cargo test --test integration -- --ignored --nocapture

  operator:
    name: Operator (control-plane envtest + build)
    needs: changes
    if: needs.changes.outputs.operator == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/control-plane
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Match the toolchain kubebuilder v4 scaffolds in go.mod.
          # The control-plane is on its own track; the curl-impersonate
          # adapter remains pinned to 1.24 in the `go` matrix above.
          go-version: "1.25"
      # The kubebuilder Makefile vendors its own controller-gen,
      # kustomize, setup-envtest and golangci-lint into bin/, then
      # `make test` downloads apiserver/etcd/kubectl via setup-envtest.
      # Cache the bin/ directory so subsequent CI runs skip those
      # downloads. The cache key is keyed on go.sum so a controller-
      # runtime bump invalidates the cache automatically.
      - name: Cache kubebuilder tool chain
        uses: actions/cache@v4
        with:
          path: core/control-plane/bin
          key: kubebuilder-bin-${{ runner.os }}-${{ hashFiles('core/control-plane/go.sum') }}
      - name: Run tests
        run: make test
      - name: Build
        run: make build

  engine-image:
    name: Engine image (build + smoke test)
    needs: changes
    if: needs.changes.outputs.engine_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      # Build the engine image with the same Dockerfile contributors
      # use locally. No registry push — see ADR-0018 §5. The smoke test
      # runs the binary in the resulting image; image publishing is a
      # release-engineering concern that fires on tagged releases, not
      # every PR.
      - name: Build engine image
        run: |
          docker buildx build \
            --platform=linux/amd64 \
            -t spectre-engine:ci \
            -f core/engine/Dockerfile \
            --load \
            .
      - name: Smoke test (spectre version)
        run: docker run --rm spectre-engine:ci version
      - name: Report image size
        run: docker images spectre-engine:ci --format '{{.Size}}'

  operator-image:
    name: Operator image (build + smoke test)
    needs: changes
    # Build the operator image whenever the operator source, the
    # engine source (the engine binary is bundled), the protocol,
    # the Dockerfile, or the workflow itself changes. The image
    # depends on the engine image, which we build in-line so the
    # job is self-contained and does not need a registry round-trip.
    if: needs.changes.outputs.operator == 'true' || needs.changes.outputs.engine_image == 'true'
    runs-on: ubuntu-latest
    # Both builds run with `docker build` (BuildKit on the daemon)
    # rather than `docker buildx build`. The default buildx
    # docker-container driver keeps an image cache isolated from the
    # local daemon, so a `--load`-ed image from one buildx call is
    # not visible to a subsequent buildx call's
    # `FROM ${ENGINE_IMAGE}`. Plain `docker build` shares the daemon
    # cache between both steps; the GitHub runner is already
    # linux/amd64 so no cross-platform emulation is needed (the
    # local justfile recipes still use buildx for the Apple Silicon
    # case, where QEMU is required).
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v6
      - name: Resolve Playwright base image pin
        id: pw-base
        run: |
          image="$(cat adapters/playwright/.playwright-base-image)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          # Extract the digest portion for the cache key so a base-
          # image bump invalidates the layer cache automatically.
          digest="${image##*@}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Resolve curl-impersonate pin
        # PR18 §4.1: read VERSION + SHA256 from
        # adapters/curl-impersonate/.curl-impersonate-version (one
        # line, "VERSION SHA256") so a bump touches one file. The
        # operator-image build downloads + verifies the tarball; the
        # SHA-256 is defence-in-depth against tarball tampering.
        id: curl-imp
        run: |
          read -r version sha256 < <(grep -v '^#' adapters/curl-impersonate/.curl-impersonate-version | head -n 1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
      # Cache the Microsoft Playwright base image layers. Pulling it
      # is ~600 MB / ~90s on an Azure runner; caching keyed on the
      # pinned digest cuts that to a few seconds. The `docker save /
      # docker load` round-trip preserves layer identity so the
      # subsequent operator-image build can reuse them.
      - name: Cache Playwright base image
        id: pw-base-cache
        uses: actions/cache@v4
        with:
          path: /tmp/pw-base.tar
          key: pw-base-${{ runner.os }}-${{ steps.pw-base.outputs.digest }}
      - if: steps.pw-base-cache.outputs.cache-hit == 'true'
        name: Load cached Playwright base
        run: docker load -i /tmp/pw-base.tar
      - if: steps.pw-base-cache.outputs.cache-hit != 'true'
        name: Pull and cache Playwright base
        run: |
          docker pull "${{ steps.pw-base.outputs.image }}"
          docker save "${{ steps.pw-base.outputs.image }}" -o /tmp/pw-base.tar
      - name: Build engine image
        run: |
          docker build \
            -t spectre-engine:ci \
            -f core/engine/Dockerfile \
            .
      - name: Build operator image
        # Build context is the repository root: each builder stage
        # regenerates its language's proto bindings from proto/. PR16
        # §6.3 / PR17 §6.5 / PR18 §6.5.
        run: |
          docker build \
            --build-arg ENGINE_IMAGE=spectre-engine:ci \
            --build-arg PLAYWRIGHT_BASE_IMAGE="${{ steps.pw-base.outputs.image }}" \
            --build-arg CURL_IMPERSONATE_VERSION="${{ steps.curl-imp.outputs.version }}" \
            --build-arg CURL_IMPERSONATE_SHA256="${{ steps.curl-imp.outputs.sha256 }}" \
            -t spectre-control-plane:ci \
            -f core/control-plane/Dockerfile \
            .
      - name: Smoke test (engine binary present)
        run: |
          docker run --rm \
            --entrypoint=/usr/local/bin/spectre \
            spectre-control-plane:ci version
      - name: Smoke test (Playwright adapter bundled)
        run: |
          docker run --rm \
            --entrypoint=/bin/sh \
            spectre-control-plane:ci -c \
            'test -f /opt/spectre/adapters/playwright/dist/index.js && \
             test -d /opt/spectre/adapters/playwright/node_modules/playwright && \
             test -f /opt/spectre/adapters/playwright/driver.yaml && \
             echo "playwright adapter assets OK"'
      - name: Smoke test (SeleniumBase adapter bundled)
        # PR17 §6 acceptance: the seleniumbase venv exists at the
        # canonical path with shebangs that resolve, the adapter
        # package imports cleanly through the editable proto-bindings
        # source, and Chrome + ChromeDriver report the same major.
        # A failure here surfaces packaging bugs (missing apt deps,
        # broken venv shebangs, version skew) before kind smoke.
        run: |
          docker run --rm \
            --entrypoint=/bin/sh \
            spectre-control-plane:ci -c '
              set -e
              test -f /opt/spectre/adapters/seleniumbase/driver.yaml
              test -x /opt/spectre/adapters/seleniumbase/.venv/bin/python
              /opt/spectre/adapters/seleniumbase/.venv/bin/python -c "import spectre_seleniumbase"
              /opt/spectre/adapters/seleniumbase/.venv/bin/python -c "from spectre.driver.v1alpha1 import driver_pb2"
              google-chrome --version
              chromedriver --version
              chrome_major=$(google-chrome --version | grep -oE "[0-9]+" | head -n 1)
              driver_major=$(chromedriver --version | grep -oE "[0-9]+" | head -n 1)
              test "${chrome_major}" = "${driver_major}"
              echo "seleniumbase adapter assets OK (chrome=${chrome_major} chromedriver=${driver_major})"
            '
      - name: Smoke test (curl-impersonate adapter bundled)
        # PR18 §6 acceptance: the static Go adapter binary exists at
        # the canonical path and is executable; driver.yaml is in
        # place so the engine resolves
        # `<adapters_path>/curl-impersonate/driver.yaml`; and the
        # default variant binary (`curl_chrome116`) is on PATH so the
        # adapter's per-Navigate `os/exec` subprocess (ADR-0016 §1)
        # resolves. A failure here surfaces a missing build-arg, a
        # bad SHA-256 pin, or a broken tarball extract before kind
        # smoke.
        run: |
          docker run --rm \
            --entrypoint=/bin/sh \
            spectre-control-plane:ci -c '
              set -e
              test -x /opt/spectre/adapters/curl-impersonate/bin/adapter
              test -f /opt/spectre/adapters/curl-impersonate/driver.yaml
              command -v curl_chrome116
              curl_chrome116 --version | head -n 1
              echo "curl-impersonate adapter assets OK"
            '
      - name: Report image size
        run: docker images spectre-control-plane:ci --format '{{.Size}}'
      - name: Save operator image for downstream jobs
        run: docker save spectre-control-plane:ci -o /tmp/spectre-control-plane.tar
      - name: Save engine image for downstream jobs
        run: docker save spectre-engine:ci -o /tmp/spectre-engine.tar
      - name: Upload operator image artifact
        uses: actions/upload-artifact@v4
        with:
          name: operator-image
          path: |
            /tmp/spectre-control-plane.tar
            /tmp/spectre-engine.tar
          retention-days: 1

  operator-smoke-kind:
    name: Operator smoke (kind end-to-end)
    needs: [changes, operator-image]
    if: needs.changes.outputs.operator == 'true' || needs.changes.outputs.engine_image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download operator + engine images
        uses: actions/download-artifact@v4
        with:
          name: operator-image
          path: /tmp
      - name: Load images into local docker
        run: |
          docker load -i /tmp/spectre-engine.tar
          docker load -i /tmp/spectre-control-plane.tar
          docker tag spectre-engine:ci         spectre-engine:dev
          docker tag spectre-control-plane:ci  spectre-control-plane:dev
      - uses: helm/kind-action@v1
        with:
          cluster_name: spectre-pr18
      - name: Install kubebuilder CLI dependencies
        # `make install` / `make deploy` need kustomize and
        # controller-gen. The kubebuilder Makefile vendors them into
        # core/control-plane/bin on demand.
        working-directory: core/control-plane
        run: |
          make kustomize
          make controller-gen
      # PR18: the smoke script runs all three bundled samples
      # sequentially (hello-hackernews → seleniumbase-extract →
      # curl-impersonate-extract). The hello-hackernews sample reaches
      # news.ycombinator.com from inside the kind node; the
      # seleniumbase-extract and curl-impersonate-extract samples both
      # reach example.com (IANA-controlled, stable, two anchor tags).
      # GitHub-hosted runners can typically reach both; if either
      # starts flaking on rate-limits, the documented fallback
      # (in-cluster fixture targeting an httpd ConfigMap) replaces
      # this step. PR16 §6.6 / PR17 §6.9 / PR18 §6.7.
      #
      # TIMEOUT_SECONDS is per-sample. SeleniumBase's first launch
      # is heavier than Playwright's (Python interpreter bootstrap
      # plus Chrome's renderer subprocess tree); curl-impersonate is
      # the lightest (no browser warm-up). 420s gives all three cases
      # comfortable headroom.
      - name: Run kind smoke
        env:
          ENGINE_IMAGE: spectre-engine:dev
          OPERATOR_IMAGE: spectre-control-plane:dev
          TIMEOUT_SECONDS: "420"
        run: bash core/control-plane/hack/smoke-kind.sh spectre-pr18

  ci-summary:
    name: CI summary
    if: always()
    needs: [changes, proto, rust, go, typescript, python, operator, operator-image, operator-smoke-kind, engine-integration, engine-image]
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "proto:                ${{ needs.proto.result }}"
          echo "rust:                 ${{ needs.rust.result }}"
          echo "go:                   ${{ needs.go.result }}"
          echo "typescript:           ${{ needs.typescript.result }}"
          echo "python:               ${{ needs.python.result }}"
          echo "operator:             ${{ needs.operator.result }}"
          echo "operator-image:       ${{ needs.operator-image.result }}"
          echo "operator-smoke-kind:  ${{ needs.operator-smoke-kind.result }}"
          echo "engine-integration:   ${{ needs.engine-integration.result }}"
          echo "engine-image:         ${{ needs.engine-image.result }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
