name: Publish images to Docker Hub

# R6.5.3 shipped this workflow as `workflow_dispatch` only; W1.2
# (Wave 1, 2026-05-07) enabled the tag-triggered path per ADR-0018
# §5 R6.5.3 update + W1.2 update. Pushing a `v*.*.*` tag now
# triggers an automatic publish; manual dispatch remains for
# exotic flows (overriding tag, partial target sets, multi-arch
# off). Main-branch `:edge` auto-publish remains deferred — that
# is a v1beta1 concern.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to VERSION file content)"
        required: false
        type: string
      targets:
        description: "Bake targets to publish (default: all five via the `default` group)"
        required: false
        type: string
        default: "default"
      multi_arch:
        description: "Build multi-arch where supported (control-plane + playwright today)"
        required: false
        type: boolean
        default: true
  push:
    tags:
      # Semver-prefixed tags trigger publish. The `Resolve image tag`
      # step strips the leading `v` and verifies the tag matches the
      # VERSION file content (mismatch fails fast — see step body).
      # Pre-release tags like `v0.1.0-alpha.1` match this glob;
      # GitHub Actions tag globs use `*` to match zero-or-more
      # non-`/` chars, so `v0.1.0-alpha.0` is matched by `v*.*.*`
      # via the `0-alpha.0` segment as one match.
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    name: Build + push to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `id-token: write` is required for cosign keyless signing
    # via GitHub OIDC (W1.4). The token is requested only by the
    # `Sign images` step at the end of the job; widening the scope
    # to the whole job (single-job workflow) is functionally
    # identical to scoping it per-step. ADR-0036 §5.8 W1.4 update
    # records the decision to integrate cosign here rather than in
    # a standalone `sign.yml`.
    permissions:
      contents: read
      id-token: write
    # DOCKERHUB_TOKEN + DOCKERHUB_USERNAME live in the `ci`
    # environment (the same one CI's image-matrix and full-stack
    # jobs draw from). Declaring `environment: ci` is what makes
    # `secrets.DOCKERHUB_TOKEN` resolve here. R6.5.3 shipped this
    # workflow without the declaration; the gap surfaced when
    # R7.1 dispatched the first real publish (login failed with
    # "Password required"). Closing it as part of R7.1.
    environment: ci
    steps:
      - uses: actions/checkout@v6

      # QEMU registers binfmt_misc handlers so BuildKit can RUN
      # arm64 commands on an amd64 runner during multi-arch
      # builds. control-plane's Go cross-compile produces an arm64
      # binary from an amd64 builder without RUN-time emulation;
      # playwright's `pnpm install` and `pnpm run build` execute
      # under emulation when targeting arm64 (~3-5x slower than
      # native). v1alpha2 may adopt native arm64 runners
      # (ubuntu-24.04-arm) if publish runtime becomes painful.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: extractions/setup-just@v4

      - name: Resolve image tag
        id: tag
        run: |
          # Three trigger paths:
          # 1. push to tag (W1.2) → strip leading `v` from the
          #    pushed tag name; verify against VERSION file
          # 2. workflow_dispatch with `tag` input → use the input
          # 3. workflow_dispatch without `tag` input → use VERSION
          if [ "${{ github.event_name }}" = "push" ]; then
            # github.ref_name is the bare tag (e.g. "v0.1.0-alpha.1")
            tag="${{ github.ref_name }}"
            tag="${tag#v}"  # strip leading "v" prefix

            # Tag-triggered runs MUST match VERSION file content.
            # The consistency check prevents pushing a tag that
            # disagrees with the committed VERSION (would publish
            # images tagged with one value but represent the source
            # state of another). Mismatch is operator error;
            # surfaces fast rather than as a silent inconsistency.
            version_file="$(cat VERSION)"
            if [ "$tag" != "$version_file" ]; then
              echo "::error::tag '${{ github.ref_name }}' (resolved to '${tag}') does not match VERSION file content '${version_file}'. Bump VERSION + commit before tagging, or retag against the committed VERSION."
              exit 1
            fi
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="$(cat VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          # Account name; defaults to `fabiocaffarello`. The repo
          # variable override is for forward-compat if the project
          # later moves to a different account or organisation.
          username: ${{ vars.DOCKERHUB_USERNAME || 'fabiocaffarello' }}
          # Personal Access Token, scoped Read/Write/Delete on the
          # `fabiocaffarello/spectre-*` repos. Maintainer-side
          # prerequisite documented in ADR-0018 §5 R6.5.3 update
          # and `docs/architecture/releases.md`.
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bake (build + push)
        env:
          # Bare `fabiocaffarello` (no `docker.io/` prefix) is
          # canonical for Docker Hub references — Docker resolves
          # it to `docker.io/fabiocaffarello/...` automatically.
          # The image() function in docker-bake.hcl produces
          # `fabiocaffarello/spectre-<name>:<tag>` from this.
          REGISTRY: fabiocaffarello
          TAG: ${{ steps.tag.outputs.tag }}
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.repository.updated_at }}
          # workflow_dispatch sets these from inputs; tag-triggered
          # push events don't carry inputs so the env vars resolve
          # to empty strings. The `${VAR:-default}` substitution in
          # the run block applies the defaults — multi_arch=true
          # (build the multi-arch images) + targets=default (all
          # five via the bake `default` group). The defaults match
          # the workflow_dispatch input defaults, so tag-triggered
          # publishes behave identically to a maintainer-dispatched
          # publish with no overrides.
          MULTI_ARCH: ${{ inputs.multi_arch }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -a
          source build/docker/versions.env
          set +a

          # Apply defaults for tag-triggered runs (where inputs are
          # absent). MULTI_ARCH defaults to true; TARGETS defaults
          # to "default".
          multi_arch="${MULTI_ARCH:-true}"
          targets="${TARGETS:-default}"

          # Per-target platform overrides. control-plane and
          # playwright build multi-arch (linux/amd64 + linux/arm64)
          # when `multi_arch` is true; the other three remain
          # amd64-only per the deferral list in ADR-0018 §5 R6.5.3
          # update. As deferred images unblock, add their override
          # here without touching docker-bake.hcl. Use a bash array
          # so empty / multi-flag expansion is correct under set -u.
          # Two `--set` per target (one per platform) renders the
          # platforms field as a proper list under `bake --print`;
          # the comma-joined single-value form
          # (`--set foo.platform=a,b`) is documented but renders
          # ambiguously, so we keep the explicit form here.
          platform_overrides=()
          if [ "$multi_arch" = "true" ]; then
            platform_overrides+=(
              "--set" "control-plane.platform=linux/amd64"
              "--set" "control-plane.platform=linux/arm64"
              "--set" "playwright.platform=linux/amd64"
              "--set" "playwright.platform=linux/arm64"
            )
          fi

          docker buildx bake \
            --push \
            "${platform_overrides[@]}" \
            $targets

      - name: Verify pushed manifests
        run: |
          # Inspect each pushed image's manifest list. control-plane
          # and playwright should report two architectures
          # (linux/amd64 + linux/arm64); the other three should
          # report one (linux/amd64). Operator confirmation that
          # the publish completed and the multi-arch story is
          # honest. A manifest-list mismatch fails the workflow
          # — see `docs/architecture/releases.md` for the partial-
          # success caveat.
          set -e
          for img in engine control-plane curl-impersonate playwright seleniumbase; do
            echo "=== fabiocaffarello/spectre-${img}:${{ steps.tag.outputs.tag }} ==="
            docker buildx imagetools inspect "fabiocaffarello/spectre-${img}:${{ steps.tag.outputs.tag }}"
          done

      # W1.4: cosign keyless signing via GitHub OIDC. Runs after
      # manifest verification so signing only fires on a confirmed-
      # good push. ADR-0036 §5.8 W1.4 update consolidates this into
      # publish.yml rather than a standalone sign.yml — atomicity
      # (no unsigned images on the registry) and digest reuse from
      # the verify loop are the wins; the trade is widening this
      # workflow's permissions to include id-token: write (scoped
      # at the job level above).
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.0.6"

      - name: Sign images (cosign keyless via GitHub OIDC)
        env:
          # COSIGN_YES suppresses the interactive confirmation
          # prompt; required for non-interactive CI runs. cosign
          # picks up the OIDC token from the workflow's id-token
          # permission automatically — no explicit token plumbing.
          COSIGN_YES: "true"
        run: |
          # Sign each image by its manifest-list digest, not by
          # tag — tags are mutable, digests are not. cosign
          # `--recursive` extends the signature to every platform-
          # specific manifest under the index, so verifiers can
          # validate either the index reference or a single-arch
          # reference. The signature payload (.sig artifact) is
          # pushed to the same Docker Hub repository alongside
          # the image; downstream consumers verify with
          #   cosign verify \
          #     --certificate-identity-regexp \
          #       'https://github\.com/FabioCaffarello/spectre/\.github/workflows/publish\.yml@.*' \
          #     --certificate-oidc-issuer \
          #       'https://token.actions.githubusercontent.com' \
          #     fabiocaffarello/spectre-<name>:<tag>
          # See docs/architecture/releases.md for the full
          # verification recipe.
          set -e
          for img in engine control-plane curl-impersonate playwright seleniumbase; do
            ref="fabiocaffarello/spectre-${img}:${{ steps.tag.outputs.tag }}"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
            echo "=== signing fabiocaffarello/spectre-${img}@${digest} ==="
            cosign sign --recursive "fabiocaffarello/spectre-${img}@${digest}"
          done
