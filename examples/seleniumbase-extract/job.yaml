# seleniumbase-extract — query and extract against a public page using
# the SeleniumBase adapter.
#
# See README.md for the run instructions. R2.3 retired the
# `spectre run` CLI; submit this DSL via `grpcurl` against the
# engine's `spectre.engine.v1alpha1.Engine.RunJob` RPC. The job
# exercises the second driver through the same DSL
# `hello-hackernews` uses against the Playwright adapter — visible
# evidence that one engine runs one protocol against two runtimes
# in two languages.

spectre: v1alpha1
driver: seleniumbase

steps:
  - navigate: https://example.com
  - extract:
      selector: a
      fields:
        text: textContent
        url: href

output:
  format: jsonl
  path: ./links.jsonl
