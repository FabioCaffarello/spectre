# curl-impersonate-extract — query and extract against a public page using
# the curl-impersonate adapter (HTTP-only, no browser).
#
# See README.md for the run instructions. R2.3 retired the
# `spectre run` CLI; submit this DSL via `grpcurl` against the
# engine's `spectre.engine.v1alpha1.Engine.RunJob` RPC. The job
# mirrors seleniumbase-extract byte-for-byte except for the
# `driver:` field — visible evidence that one engine runs one
# protocol against three runtimes in three languages.

spectre: v1alpha1
driver: curl-impersonate

steps:
  - navigate: https://example.com
  - extract:
      selector: a
      fields:
        text: textContent
        url: href

output:
  format: jsonl
  path: ./links.jsonl
