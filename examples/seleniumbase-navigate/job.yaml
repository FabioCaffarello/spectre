# seleniumbase-navigate — exercise the SeleniumBase adapter against
# the public example.com page using only the `navigation` capability.
#
# Run via: spectre run examples/seleniumbase-navigate/job.yaml
# See README.md for status. PR9 implements only Initialize and
# Navigate on the SeleniumBase adapter, so this job is intentionally
# narrower than examples/hello-hackernews/job.yaml (which requires
# Query + Extract). PR10 will add an extraction-capable example
# against this driver.

spectre: v1alpha1
driver: seleniumbase

steps:
  - navigate: https://example.com

output:
  format: jsonl
  path: ./output.jsonl
