# hello-hackernews — extract titles and URLs from the HN front page.
#
# Run via: cd core/engine && cargo run --example hello-hackernews
# See ../README.md for status. The Go CLI wrapper lands in PR8.

spectre: v1alpha1
driver: playwright

steps:
  - navigate: https://news.ycombinator.com
  - extract:
      selector: .titleline > a
      fields:
        title: textContent
        url: href

output:
  format: jsonl
  path: ./stories.jsonl
