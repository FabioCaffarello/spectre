# hello-hackernews — extract titles and URLs from the HN front page.
#
# See ./README.md for the run instructions. R2.3 retired the
# `spectre run` CLI; submit this DSL via `grpcurl` against the
# engine's `spectre.engine.v1alpha1.Engine.RunJob` RPC.

spectre: v1alpha1
driver: playwright

steps:
  - navigate: https://news.ycombinator.com
  - extract:
      selector: .titleline > a
      fields:
        title: textContent
        url: href

output:
  format: jsonl
  path: ./stories.jsonl
