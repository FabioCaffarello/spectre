[package]
name = "spectre-engine"
version = "0.1.0-alpha.3"
edition = "2024"
rust-version = "1.85"
description = "Spectre engine core: DSL parsing, planning, and execution scheduling."
repository = "https://github.com/FabioCaffarello/spectre"
license = "Apache-2.0"
readme = "README.md"
keywords = ["spectre", "browser-automation", "extraction"]
categories = ["development-tools"]
publish = false

[lib]
path = "src/lib.rs"

# The engine binary. R2.3 retired the CLI subcommands (`run`,
# `validate`, `version` standalone); the binary that survives is the
# gRPC service entry point. ADR-0013's CLI rationale is superseded
# by ADR-0020 §3.
[[bin]]
name = "spectre"
path = "src/bin/spectre.rs"

[dependencies]
# Driver protocol: tonic provides the async-runtime-agnostic gRPC
# stack over HTTP/2; prost handles message (de)serialisation. Both
# are direct dependencies so downstream consumers of the engine
# crate see the same protobuf types. R2.3 added `tonic-health` for
# the standard health-check service the engine registers alongside
# its `spectre.engine.v1alpha1.Engine` server (ADR-0021 §6).
#
# The four-crate stack (prost / prost-types / tonic / tonic-health)
# plus the build-time tonic-build below must move in lock-step.
# tonic 0.13.x depends on `prost ^0.13`, so prost 0.14 cannot land
# alongside it without a `tonic-prost` integration crate (introduced
# in tonic 0.14). Dependabot's split bumps in PRs #34 (prost 0.14)
# and #44 (tonic 0.13) merged independently and produced a diamond
# dependency that broke the generated code. Until the project
# migrates to tonic 0.14 + tonic-prost, all four crates stay on
# the 0.13 line.
prost = "0.13"
prost-types = "0.13"
# tonic 0.13 split the `Server::add_service` builder out into the
# `router` feature (axum-backed). The default feature set bundles
# router/transport/codegen/prost; pulling those in by name keeps the
# binary's `Server::builder().add_service(...)` chain compiling.
# W3.3 added the `tls-ring` feature for ADR-0032 mTLS — rustls
# with the `ring` crypto provider. tonic 0.13.1 splits its TLS
# surface across `tls-ring` / `tls-aws-lc` / `tls-native-roots` /
# `tls-webpki-roots`; `tls-ring` is sufficient for the
# server-side `ServerTlsConfig::identity` + `client_ca_root` path
# the engine takes (mTLS, client cert required, internal CA chain
# loaded from `/etc/spectre/tls/ca.crt`).
#
# tonic 0.13's `ServerTlsConfig` does NOT expose a rustls
# `cert_resolver` injection — dynamic per-handshake credential
# resolution (ADR-0032 §5.1) is therefore Wave 5+ work gated on a
# tonic 0.14 migration. v1alpha1 first auth PR uses static-load-
# at-startup; rotation triggers a Pod restart via the chart's
# annotation pattern. ADR-0032 §5.2 accepts this for Python; Rust
# carries the same operational shape.
tonic = { version = "0.13", default-features = false, features = ["codegen", "prost", "router", "transport", "tls-ring"] }
tonic-health = { version = "0.13", default-features = false }
# PEM parsing — `rustls_pemfile::certs` and `private_key` read
# `/etc/spectre/tls/{tls.crt,tls.key,ca.crt}` into the rustls
# structs tonic's `Identity::from_pem` / `Certificate::from_pem`
# consume. The 2.x line aligns with rustls 0.23 which tonic 0.13
# brings transitively via `tls-ring`.
rustls-pemfile = "2"
# rustls 0.23 itself is pulled directly so we can call
# `rustls::crypto::ring::default_provider().install_default()` at
# the top of `main()`. rustls 0.23's auto-detection of the
# process-level CryptoProvider bails when multiple consumers
# (sqlx + reqwest + aws-sdk-s3 + tonic via tls-ring) sit in the
# same build — `Server::tls_config(...)` then panics on the first
# handshake. Explicit `install_default` resolves it. We match
# tonic's `tls-ring` feature with the `ring` provider here so the
# same crypto stack serves the whole binary.
#
# `default-features = false` strips the `aws-lc-rs` default
# (avoids dragging in a second crypto provider that would re-trip
# the ambiguity).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }

# W5.1 — proxy-broker consumer per ADR-0037. Path dep so the
# engine builds against the in-tree SDK at sdks/rust/proxy/
# v1alpha1/. Per ADR-0027 + D14: SDK lands when consumer exists;
# the engine's `services::proxy::EngineProxyClient` is the
# consumer. Future Wave 5-10 services append parallel path deps
# here as their consumer wrappers land in `services/`.
spectre-sdk-proxy-v1alpha1 = { path = "../../sdks/rust/proxy/v1alpha1" }

# Tokio runtime: async I/O, signal handling, timeouts, channels, and
# the multi-threaded scheduler the engine binary uses. The `process`
# feature went away with the subprocess launcher in R2.3.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "signal", "time", "fs", "net", "sync"] }
tokio-stream = { version = "0.1", default-features = false }

# Serialisation: YAML for DSL input, JSON for output rows.
# `serde_yaml_ng` is the community fork after the upstream
# `serde_yaml` was archived; see ADR-0012 §3.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Error plumbing: thiserror for the public `EngineError` enum;
# anyhow gives the engine binary context-rich top-level errors
# without forcing a public error type on the library API.
thiserror = "2"
anyhow = "1"

# tracing-subscriber initialises the binary's stderr logging.
# RUST_LOG always wins; WARN otherwise.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# URL validation in DSL parsing; structured logs; correlation-id
# generation for `RunJob` requests that arrive without one set.
url = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# ISO-8601 timestamps stamped on Kafka message headers (R4.4 —
# ADR-0023 §3 specifies ISO-8601 for the `timestamp` header). Pulled
# in only for `Utc::now()` + RFC3339 formatting; `default-features =
# false` skips the `oldtime` legacy compatibility surface and the
# wasm bindings.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Postgres persistence (R4.2 — ADR-0023 §2). The engine writes one
# row to `jobs` per RunJob and (for stdout-sinked jobs) one row to
# `job_rows` per extracted row. Compile-time-checked queries via
# `query!()` macros per ADR-0023 §8; the offline cache lives at
# engines/engine/.sqlx/ so the Dockerfile (and CI) can build without a
# running Postgres.
#
# `default-features = false` is critical: the default feature set
# pulls `runtime-tokio-native-tls` which would link system OpenSSL.
# `runtime-tokio-rustls` brings rustls 0.23, which does not conflict
# with the tonic 0.13 stack above (tonic 0.13's transport feature is
# rustls-free in our configuration).
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "json",
    "macros",
    "migrate",
] }

# Kafka producer (R4.4 — ADR-0023 §3). rust-rdkafka wraps librdkafka,
# the canonical Kafka client implementation in C. The engine uses a
# single shared `FutureProducer` for the lifetime of the process and
# publishes one message per extracted row when a job's sink is
# `OutputSink.Kafka`.
#
# Feature choices, all deliberate:
#
# - `cmake-build` compiles librdkafka from source via cmake at build
#   time. Removes the dependency on a system-provided librdkafka
#   (which would have to be pinned in CI / the engine Dockerfile and
#   would diverge across contributors). The Cargo cache amortises
#   the cost across rebuilds.
# - `ssl-vendored` vendors OpenSSL alongside librdkafka so future
#   v1alpha2 SASL/mTLS work (ADR-0023 §10) requires no feature flag
#   churn. The first clean build pays an extra 10-15 minutes for the
#   OpenSSL compile; cached thereafter.
# - `tokio` integrates `FutureProducer`'s delivery futures with
#   the engine's tokio runtime.
#
# rdkafka uses OpenSSL via librdkafka — *deliberately* a separate
# TLS stack from the rustls 0.23 sqlx pulls in. The two libraries
# do not conflict (different language ecosystems, different ABIs).
rdkafka = { version = "0.39", default-features = false, features = [
    "cmake-build",
    "ssl-vendored",
    "tokio",
] }

# S3 client (R5.1 — ADR-0024 §3). The official AWS SDK for Rust;
# production-parity choice over the third-party `rust-s3` crate.
# Custom endpoints (MinIO, Cloudflare R2, Wasabi, Backblaze B2)
# are supported via the `endpoint_url` builder so the same client
# serves dev (Compose MinIO) and prod (real S3) without branching.
#
# `default-features = false` plus `rt-tokio` + `rustls` align the
# TLS stack with sqlx's rustls 0.23 (single rustls in the tree;
# rdkafka's vendored OpenSSL is a separate ABI handled by
# librdkafka's C linkage). `behavior-version-latest` opts into the
# SDK's stable behaviour pinning so a 1.x minor bump cannot silently
# shift auth precedence, retry policy, or signing version.
#
# `aws-credential-types`'s `hardcoded-credentials` feature exposes
# the constructor used when SPECTRE_S3_ACCESS_KEY_ID +
# SPECTRE_S3_SECRET_ACCESS_KEY are set; without the feature the
# SDK only accepts credentials from its default chain.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "rustls",
    "behavior-version-latest",
] }
aws-config = { version = "1", default-features = false, features = [
    "rt-tokio",
    "rustls",
    "behavior-version-latest",
] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }

# OpenTelemetry observability (W3.1 — ADR-0031). The five-crate
# stack (opentelemetry / opentelemetry_sdk / opentelemetry-otlp /
# opentelemetry-prometheus / opentelemetry-semantic-conventions)
# plus tracing-opentelemetry must move in lock-step on the 0.32.x
# line — all six publish from the `open-telemetry/opentelemetry-rust`
# tree and pin against each other internally. Bumps follow that
# repo's release cadence.
#
# `default-features = false` where the SDK supports it: ADR-0031
# §2.4 defers OTel logs to v1beta1 (Rust support is incomplete);
# the logs SDK is intentionally NOT pulled in here. Logs continue
# to flow through tracing-subscriber's JSON stdout layer (Cluster D).
#
# Feature choices:
#
# - `trace` + `metrics` on the API/SDK: the two signals W3.1 emits.
# - `rt-tokio` on the SDK: integrates batch span processors with the
#   engine's tokio runtime.
# - `grpc-tonic` on the OTLP exporter: matches the platform's gRPC
#   posture (ADR-0022) + reuses the tonic 0.13 stack already in
#   the tree.
# - `prometheus-encoding` on opentelemetry-prometheus: enables
#   text encoding of OTel meter readings into the prometheus
#   Registry shared with process-collector below.
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry-prometheus = { version = "0.32", default-features = false, features = ["prometheus-encoding"] }
opentelemetry-semantic-conventions = "0.32"

# tracing-opentelemetry bridges `tracing::span!` macros to OTel
# spans and surfaces the active span's trace_id/span_id in
# tracing events — the engine's JSON log layer (Cluster D) reads
# these fields from the span context per ADR-0031 §3.4.
tracing-opentelemetry = "0.32"

# Prometheus crate: provides the `Registry` opentelemetry-prometheus
# exports into, the `TextEncoder` for serving `/metrics` in
# OpenMetrics text format, and the process collector emitting the
# OTel-standard `process_*` metrics ADR-0031 §5.5 mandates
# (`process_cpu_seconds_total`, `process_resident_memory_bytes`,
# `process_open_fds`, ...). The `process` feature is Unix-only
# (auto-disabled on non-Unix targets; engine ships Linux-only).
prometheus = { version = "0.14", default-features = false, features = ["process"] }

# axum drives the `:9090` `/metrics` sidecar HTTP server (R7.1 ADR-
# 0031 §3.3 uniform port; W3.1 first landing). tonic 0.13's router
# feature already pulls axum transitively; promoting it to a direct
# dep pins the version we serve `/metrics` from and aligns with the
# dev-dependency posture used in `tests/webhook_integration.rs`.
# The minimal feature set keeps the binary footprint comparable to
# the transitive pull.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# HTTP webhook client (R5.1 — ADR-0024 §4). reqwest is the
# de-facto Rust HTTP client; rustls-tls-native-roots picks up the
# OS trust store so corporate proxies / private CAs work without
# env gymnastics. `default-features = false` skips `default-tls`
# (native-tls) which would pull a second TLS stack; the chosen
# rustls features align with sqlx's rustls 0.23.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "json",
    "gzip",
] }

[build-dependencies]
# tonic-build invokes prost-build at compile time to write the
# generated code into Cargo's OUT_DIR. See `build.rs`. The version
# tracks the runtime tonic crate (both at 0.13.x); tonic-build 0.13
# generates code against the prost 0.13 trait shape that the runtime
# tonic 0.13 expects.
tonic-build = { version = "0.13", default-features = false, features = ["prost"] }

[dev-dependencies]
# tempfile is used by output-sink unit tests to allocate a
# deterministic JSONL output path.
tempfile = "3"

# rcgen generates self-signed PKI material natively in Rust for
# `tests/tls_integration.rs` (W3.3). Replaces an earlier
# `openssl req -x509 -addext ...` invocation that produced X.509 v1
# CAs on Ubuntu CI's OpenSSL 3.0 (passed locally on macOS OpenSSL 3.6,
# where the same flags emitted v3) — rustls/webpki rejects v1 CAs
# with `UnsupportedCertVersion`. rcgen always emits v3 with the
# right extensions, eliminating the toolchain skew.
rcgen = "0.13"

# axum was a dev-dependency for `tests/webhook_integration.rs`
# (R5.1 — ADR-0024 §4). W3.1 promoted it to a regular dependency
# for the metrics sidecar; the [dependencies] declaration above
# satisfies the test crate's usage too — Cargo unifies features
# across dev + runtime.

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
