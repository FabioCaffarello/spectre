name: playwright
version: 0.1.0-alpha.2
protocol_version: spectre.driver.v1alpha1

# Each capability lands once its RPC and the conformance tests for it
# ship together. The conformance suite asserts byte-for-byte equality
# between this list and the runtime `Capabilities.names` returned by
# `Initialize`; keep this file in lockstep with `src/capabilities.ts`.
capabilities:
  - extract_attribute
  - extract_eval
  - extract_html
  - extract_text
  - js_execution
  - navigation
  - query_attribute
  - query_css
  - query_text
  - query_xpath
  - screenshot_element
  - screenshot_full_page
  - screenshot_viewport

# `runtime.command` is the spawn directive read by the conformance
# harness in R2.2. The `transports:` block from the prior UDS-era
# manifest is retired (ADR-0022 §5). When the Compose stack lands in
# R6.2, service definitions there supersede the harness-spawn flow
# and `runtime.command` becomes documentation only.
runtime:
  node: ">=20"
  command: ["node", "dist/index.js"]
  packages:
    - "playwright@>=1.49"

maintainers:
  - name: Fabio Caffarello
    github: FabioCaffarello

license: Apache-2.0
