name: playwright
version: 0.1.0-alpha.0
protocol_version: spectre.driver.v1alpha1

transports:
  - kind: grpc-uds
    command: ["node", "dist/index.js"]

# Each capability lands once its RPC and the conformance tests for it
# ship together. The conformance suite asserts byte-for-byte equality
# between this list and the runtime `Capabilities.names` returned by
# `Initialize`; keep this file in lockstep with `src/capabilities.ts`.
capabilities:
  - navigation
  - js_execution

runtime:
  node: ">=20"
  packages:
    - "playwright@>=1.49"

maintainers:
  - name: Fabio Caffarello
    github: FabioCaffarello

license: Apache-2.0
