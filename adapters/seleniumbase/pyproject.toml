[project]
name = "spectre-seleniumbase"
version = "0.1.0a0"
description = "Spectre SeleniumBase driver adapter."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Fabio Caffarello", email = "fabio.caffarello@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Generated bindings for the Driver Protocol. Sourced from
    # `proto/gen/python` (gitignored, produced by
    # `just proto-generate`). See ADR-0007.
    "spectre-driver-protocol",
    # SeleniumBase wraps Selenium WebDriver with ergonomic helpers
    # and integrated ChromeDriver management. The adapter uses the
    # `seleniumbase.Driver` factory in `sessions.py`.
    "seleniumbase>=4.32",
    # gRPC server runtime. spectre-driver-protocol pulls this in
    # transitively; declaring it here keeps the adapter's direct
    # dependency surface explicit and matches the conformance pin.
    "grpcio>=1.60",
    # Standard gRPC health checking. The adapter registers
    # `grpc.health.v1.Health` as part of the R2.2 transport switch
    # (ADR-0021 §6); the conformance harness polls it as the
    # readiness signal.
    "grpcio-health-checking>=1.60",
    # Pillow handles the PNG -> JPEG conversion in the Screenshot
    # handler — Selenium returns PNG bytes natively, the v1alpha1
    # protocol also accepts JPEG, and Pillow is the conventional
    # path. ADR-0015 §4 records the dependency rationale.
    "Pillow>=10.0",
    # Redis client used by the SessionManager to externalise
    # session metadata (ADR-0023 §4 + §5). The adapter PINGs Redis
    # at startup and exits non-zero on failure (§6 — Redis
    # required). Each non-Initialize RPC validates the
    # adapter_instance_id against the stored value and surfaces
    # foreign-instance sessions as gRPC UNAVAILABLE.
    "redis>=5.0",
]

[tool.uv.sources]
spectre-driver-protocol = { path = "../../proto/gen/python", editable = true }

[project.urls]
Homepage = "https://github.com/FabioCaffarello/spectre"
Repository = "https://github.com/FabioCaffarello/spectre"

[project.scripts]
spectre-seleniumbase = "spectre_seleniumbase.adapter:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-protobuf>=4.24",
    # In-memory Redis fake for unit tests. Production Redis stays
    # under the conformance suite (which exercises the real
    # docker-compose service); fakeredis keeps unit tests fast and
    # hermetic.
    "fakeredis>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectre_seleniumbase"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# Generated protobuf modules are untyped (the buf python plugin does
# not emit stubs). Treat them as Any-typed at the boundary; we re-
# annotate values pulled from the descriptor in source files.
[[tool.mypy.overrides]]
module = ["spectre.driver.v1alpha1.*"]
ignore_missing_imports = true
follow_imports = "skip"

# `grpcio` ships without bundled type stubs. Treat its public API as
# Any-typed; the adapter wraps it so leakage is bounded. `grpc_health`
# is the same story — it ships in `grpcio-health-checking` without
# stubs.
[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "grpc_health", "grpc_health.*"]
ignore_missing_imports = true

# SeleniumBase and Selenium WebDriver do not ship type stubs in a
# form mypy can consume cleanly. Treat them as Any-typed at the
# boundary; the session manager wraps every Driver call so leakage
# is bounded to that one file.
[[tool.mypy.overrides]]
module = ["seleniumbase", "seleniumbase.*", "selenium", "selenium.*"]
ignore_missing_imports = true

# Pillow ships its own stubs but they are extensive enough that
# treating the import as Any-typed at the boundary keeps the
# screenshot handler's PNG-to-JPEG path easy to read. The
# conversion is bounded to ``_png_to_jpeg`` in ``server.py``.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

# redis-py and fakeredis: the bundled stubs claim every command
# can be awaitable to accommodate the asyncio variant, which means
# the sync code path looks like ``Awaitable[Any] | Any`` to mypy.
# Treating them as Any-typed keeps the wrapper readable; the
# ``RedisClient`` class in ``redis_client.py`` is the only file
# that touches the boundary.
[[tool.mypy.overrides]]
module = ["redis", "redis.*", "fakeredis", "fakeredis.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
