name: seleniumbase
version: 0.1.0a0
protocol_version: spectre.driver.v1alpha1

# Each capability lands once its RPC and the conformance tests for it
# ship together (ADR-0014 §1). The conformance suite asserts byte-for-
# byte equality between this list and the runtime `Capabilities.names`
# returned by `Initialize`; keep this file in lockstep with
# `src/spectre_seleniumbase/capabilities.py`.
#
# `screenshot_full_page` is intentionally absent: Selenium WebDriver
# has no reliable, browser-independent full-page capture API, and
# the capability progression contract says declared = tested. The
# Playwright adapter declares thirteen names; this adapter declares
# twelve. ADR-0015 §5 records the rationale.
capabilities:
  - extract_attribute
  - extract_eval
  - extract_html
  - extract_text
  - js_execution
  - navigation
  - query_attribute
  - query_css
  - query_text
  - query_xpath
  - screenshot_element
  - screenshot_viewport

# `runtime.command` is the spawn directive read by the conformance
# harness in R2.2. The `transports:` block from the prior UDS-era
# manifest is retired (ADR-0022 §5). When the Compose stack lands in
# R6.2, service definitions there supersede the harness-spawn flow
# and `runtime.command` becomes documentation only.
#
# Relative path to the uv-managed virtualenv. Mirrors the Playwright
# manifest's `["node", "dist/index.js"]` pattern: the harness runs the
# command with cwd set to the adapter directory, so this resolves to
# `adapters/seleniumbase/.venv/bin/python`. Run `just sb-bootstrap`
# (or `uv sync --all-extras --dev`) once before the adapter is
# launched.
runtime:
  python: ">=3.10"
  command: [".venv/bin/python", "-m", "spectre_seleniumbase.adapter"]
  packages:
    - "seleniumbase>=4.32"

maintainers:
  - name: Fabio Caffarello
    github: FabioCaffarello

license: Apache-2.0
