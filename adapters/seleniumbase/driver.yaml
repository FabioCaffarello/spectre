name: seleniumbase
version: 0.1.0a0
protocol_version: spectre.driver.v1alpha1

transports:
  - kind: grpc-uds
    # Relative path to the uv-managed virtualenv. Mirrors the
    # Playwright manifest's `["node", "dist/index.js"]` pattern:
    # the launcher runs the command with cwd set to the adapter
    # directory, so this resolves to
    # `adapters/seleniumbase/.venv/bin/python`. Run
    # `just sb-bootstrap` (or `uv sync --all-extras --dev`) once
    # before the adapter is launched. Using the venv's python
    # rather than PATH-resolved `python` keeps the adapter's
    # dependencies (seleniumbase, grpcio) isolated from whatever
    # interpreter happens to be on PATH; it also avoids the
    # macOS gotcha where `python` is absent and only `python3`
    # exists.
    command: [".venv/bin/python", "-m", "spectre_seleniumbase.adapter"]

# Each capability lands once its RPC and the conformance tests for it
# ship together (ADR-0014 §1). The conformance suite asserts byte-for-
# byte equality between this list and the runtime `Capabilities.names`
# returned by `Initialize`; keep this file in lockstep with
# `src/spectre_seleniumbase/capabilities.py`.
#
# `screenshot_full_page` is intentionally absent: Selenium WebDriver
# has no reliable, browser-independent full-page capture API, and
# the capability progression contract says declared = tested. The
# Playwright adapter declares thirteen names; this adapter declares
# twelve. ADR-0015 §5 records the rationale.
capabilities:
  - extract_attribute
  - extract_eval
  - extract_html
  - extract_text
  - js_execution
  - navigation
  - query_attribute
  - query_css
  - query_text
  - query_xpath
  - screenshot_element
  - screenshot_viewport

runtime:
  python: ">=3.10"
  packages:
    - "seleniumbase>=4.32"

maintainers:
  - name: Fabio Caffarello
    github: FabioCaffarello

license: Apache-2.0
