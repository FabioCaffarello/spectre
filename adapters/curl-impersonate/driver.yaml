name: curl-impersonate
version: 0.1.0-alpha.1
protocol_version: spectre.driver.v1alpha1

# Capabilities follow the "declared = tested" rule from ADR-0014 §1.
# Six entries, alphabetical (Close + Query + Extract). The
# capability list will not grow further in v1alpha1:
#
#   - `js_execution` and `extract_eval` are absent — no JavaScript
#     engine, the coherence rule from ADR-0010 §3 forbids declaring
#     extract_eval without js_execution.
#   - `screenshot_viewport`, `screenshot_full_page`,
#     `screenshot_element` are absent — no rendering pipeline.
#   - `query_text` and `query_attribute` are omitted under
#     ADR-0017 §1 because cross-driver semantic equivalence cannot
#     be honoured (Playwright's `getByText` searches rendered
#     visible text; goquery's `:contains()` searches DOM text;
#     SeleniumBase via XPath sits between them). A single name with
#     three semantic interpretations defeats the planning surface.
#
# ADR-0016 §5 / ADR-0017 §1 record the architectural framing.
capabilities:
  - extract_attribute
  - extract_html
  - extract_text
  - navigation
  - query_css
  - query_xpath

# The adapter invokes `curl_chrome116` by default. Operators can
# pick a different curl-impersonate variant by setting
# SPECTRE_CURL_VARIANT before launching the adapter. Known-working
# alternatives include `curl_chrome110`, `curl_chrome119`,
# `curl_firefox117`, and `curl_safari16_5` — availability depends
# on the curl-impersonate release that's installed on PATH. See
# ADR-0016 §3.

# `runtime.command` is the spawn directive read by the conformance
# harness in R2.2. The `transports:` block from the prior UDS-era
# manifest is retired (ADR-0022 §5). When the Compose stack lands in
# R6.2, service definitions there supersede the harness-spawn flow
# and `runtime.command` becomes documentation only.
runtime:
  go: ">=1.22"
  command: ["./bin/adapter"]
  system_libraries:
    - "curl-impersonate"

maintainers:
  - name: Fabio Caffarello
    github: FabioCaffarello

license: Apache-2.0
