---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: scrapejobs.spectre.io
spec:
  group: spectre.io
  names:
    kind: ScrapeJob
    listKind: ScrapeJobList
    plural: scrapejobs
    singular: scrapejob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.rowsExtracted
      name: Rows
      type: integer
    - jsonPath: .status.resolvedEngineEndpoint
      name: Engine
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: ScrapeJob is the Schema for the scrapejobs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ScrapeJob
            properties:
              engineRef:
                description: |-
                  engineRef identifies the engine service the operator dials
                  for this job. Exactly one of Service or Endpoint must be set
                  (CEL-validated). When unset, the operator falls back to its
                  startup-time `--engine-endpoint` / `SPECTRE_ENGINE_ENDPOINT`
                  configuration.
                properties:
                  endpoint:
                    description: |-
                      Endpoint is a direct host:port string. Useful for testing or
                      for engines outside the cluster. Mutually exclusive with
                      Service.
                    type: string
                  service:
                    description: |-
                      Service references a Kubernetes Service in the specified
                      Namespace. The operator resolves to
                      `<service>.<namespace>.svc.cluster.local:<port>`. Mutually
                      exclusive with Endpoint.
                    properties:
                      name:
                        description: Name of the Kubernetes Service.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace of the Kubernetes Service. Defaults to the
                          ScrapeJob's own namespace if empty.
                        type: string
                      port:
                        default: 8090
                        description: |-
                          Port number of the Service. Defaults to 8090 (the engine's
                          canonical port from ADR-0021 §4 / ADR-0025 §7).
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    required:
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of service, endpoint must be set
                  rule: '(has(self.service) ? 1 : 0) + (has(self.endpoint) ? 1 : 0)
                    == 1'
              jobDSL:
                description: |-
                  jobDSL is the inline YAML document describing the scrape job.
                  The engine parses, plans, resolves the requested driver, and
                  runs the plan. The DSL grammar is documented in ADR-0012.
                minLength: 1
                type: string
              outputSink:
                description: |-
                  outputSink describes where the engine's JSONL row events
                  land. Exactly one of Stdout, Kafka, S3, or Webhook must be
                  set (CEL-validated). R3.2 implements only Stdout; the others
                  fail at admission with "not yet implemented" until R4.4 /
                  R5.1 wire them.
                properties:
                  kafka:
                    description: |-
                      Kafka publishes JSONL rows to a Kafka topic. R4.4 wires the
                      Kafka producer; R3.2 admission rejects with "kafka output
                      sink not yet implemented".
                    properties:
                      brokers:
                        description: Brokers is the list of Kafka broker host:port
                          addresses.
                        items:
                          type: string
                        minItems: 1
                        type: array
                      topic:
                        description: Topic is the Kafka topic the engine publishes
                          to.
                        minLength: 1
                        type: string
                    required:
                    - brokers
                    - topic
                    type: object
                  s3:
                    description: |-
                      S3 uploads JSONL output to an S3-compatible bucket. R5.1
                      wires the S3 client; R3.2 admission rejects with "s3 output
                      sink not yet implemented".
                    properties:
                      bucket:
                        description: Bucket is the S3 bucket name.
                        minLength: 1
                        type: string
                      endpoint:
                        description: |-
                          Endpoint overrides the default S3 endpoint (for MinIO, R2,
                          etc).
                        type: string
                      key:
                        description: |-
                          Key is the object key within the bucket. Supports
                          `{{.JobID}}` template substitution at upload time.
                        type: string
                      region:
                        default: us-east-1
                        description: Region is the AWS region. Defaults to us-east-1.
                        type: string
                    required:
                    - bucket
                    - key
                    type: object
                  stdout:
                    description: |-
                      Stdout writes JSONL rows to the operator's stdout, surfaced
                      via `kubectl logs <operator-pod>`.
                    type: object
                  webhook:
                    description: |-
                      Webhook POSTs JSONL rows to an HTTP endpoint. R5.1 wires the
                      webhook client; R3.2 admission rejects with "webhook output
                      sink not yet implemented".
                    properties:
                      batchSize:
                        default: 0
                        description: |-
                          BatchSize is the number of rows per HTTP request. Zero means
                          one row per request.
                        format: int32
                        minimum: 0
                        type: integer
                      method:
                        default: POST
                        description: Method is the HTTP method.
                        enum:
                        - POST
                        - PUT
                        type: string
                      url:
                        description: URL is the HTTP endpoint that receives JSONL
                          rows.
                        pattern: ^https?://.+$
                        type: string
                    required:
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one of stdout, kafka, s3, webhook must be set
                  rule: '(has(self.stdout) ? 1 : 0) + (has(self.kafka) ? 1 : 0) +
                    (has(self.s3) ? 1 : 0) + (has(self.webhook) ? 1 : 0) == 1'
              resources:
                description: |-
                  resources is a hint forwarded to the engine. The operator
                  does not enforce limits in v1alpha2 (the engine runs in its
                  own Pod with its own resources); the field exists for
                  forward-compatibility with per-job Pods (a future runtime
                  model evolution).
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              timeoutSeconds:
                default: 600
                description: |-
                  timeoutSeconds bounds the entire job runtime. Defaults to
                  600 (10 minutes). The reconciler propagates this as a
                  context deadline to the engine client.
                format: int32
                minimum: 1
                type: integer
            required:
            - jobDSL
            - outputSink
            type: object
          status:
            description: status defines the observed state of ScrapeJob
            properties:
              completedAt:
                description: |-
                  completedAt is the timestamp at which the job transitioned
                  to a terminal phase (Completed or Failed).
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions carries standard Kubernetes condition entries for
                  diagnostic purposes. Per ADR-0019 §4 they complement (do not
                  replace) the phase as the authoritative lifecycle state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              error:
                description: |-
                  error captures the failure reason when phase is Failed.
                  Structured failure information lives in Conditions.
                type: string
              phase:
                description: |-
                  phase is the current lifecycle phase. The state machine
                  (Pending → Running → Completed | Failed) is unchanged from
                  v1alpha1; see ADR-0019 §4.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                type: string
              resolvedEngineEndpoint:
                description: |-
                  resolvedEngineEndpoint records the host:port the operator
                  actually dialed for this job. Useful for debugging EngineRef
                  resolution issues — if the spec used a Service form but the
                  status shows the default endpoint, resolution fell back.
                type: string
              rowsExtracted:
                description: |-
                  rowsExtracted is the total number of JSONL rows the engine
                  produced.
                format: int64
                type: integer
              startedAt:
                description: |-
                  startedAt is the timestamp at which the job transitioned to
                  Running.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
