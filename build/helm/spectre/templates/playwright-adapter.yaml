{{- if .Values.playwrightAdapter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spectre.fullname" . }}-playwright-adapter
  labels:
    {{- include "spectre.labels" . | nindent 4 }}
    app.kubernetes.io/component: playwright-adapter
spec:
  replicas: {{ .Values.playwrightAdapter.replicas }}
  selector:
    matchLabels:
      {{- include "spectre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: playwright-adapter
  template:
    metadata:
      {{- with .Values.playwrightAdapter.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "spectre.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: playwright-adapter
        {{- with .Values.playwrightAdapter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.playwrightAdapter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.playwrightAdapter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.playwrightAdapter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: playwright-adapter
          image: {{ include "spectre.image" (dict "service" .Values.playwrightAdapter "context" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.playwrightAdapter.service.port }}
              protocol: TCP
          env:
            - name: SPECTRE_ADAPTER_GRPC_PORT
              value: {{ .Values.playwrightAdapter.service.port | quote }}
            {{- include "spectre.commonEnv" . | nindent 12 }}
            {{- with .Values.playwrightAdapter.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.playwrightAdapter.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.playwrightAdapter.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.playwrightAdapter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spectre.fullname" . }}-playwright-adapter
  labels:
    {{- include "spectre.labels" . | nindent 4 }}
    app.kubernetes.io/component: playwright-adapter
spec:
  type: {{ .Values.playwrightAdapter.service.type }}
  ports:
    - port: {{ .Values.playwrightAdapter.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "spectre.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: playwright-adapter
{{- end }}
