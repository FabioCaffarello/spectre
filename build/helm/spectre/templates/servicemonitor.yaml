{{- /*
ServiceMonitor (Prometheus Operator CRD) — ADR-0031 §3.3 +
W3.1 Cluster F.

Renders only when `observability.serviceMonitor.enabled: true`.
Requires `monitoring.coreos.com/v1` CRDs in the cluster
(`kubectl get crd servicemonitors.monitoring.coreos.com`); the
chart does NOT install the prometheus-operator subchart — that
choice is deployment-side per ADR-0031 §11.

Selects the engine + control-plane + three adapter Services by
their `app.kubernetes.io/component` label, scraping the
`metrics` named port that points at `observability.metricsPort`
in every service template. The shared port name keeps the
selector stable even if the value changes. W3.2 (2026-05-11)
extends the selector with the three `*-adapter` components.
*/ -}}
{{- if .Values.observability.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "spectre.fullname" . }}
  labels:
    {{- include "spectre.labels" . | nindent 4 }}
    {{- with .Values.observability.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - {{ default .Chart.Name .Values.nameOverride }}
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - engine
          - control-plane
          - playwright-adapter
          - seleniumbase-adapter
          - curl-impersonate-adapter
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
{{- end }}
