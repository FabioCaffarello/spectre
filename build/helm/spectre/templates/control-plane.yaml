{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spectre.fullname" . }}-control-plane
  labels:
    {{- include "spectre.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels:
      {{- include "spectre.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "spectre.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "spectre.controlPlaneServiceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      {{- include "spectre.tlsVolumes" (dict "slot" "control-plane" "context" .) | nindent 6 }}
      containers:
        - name: manager
          image: {{ include "spectre.image" (dict "service" .Values.controlPlane "context" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          # W3.1 Cluster E + F: the operator's metrics server binds
          # `:9090` HTTP (no auth — defers to W3.3 mTLS per
          # ADR-0032). The chart sources the port from the shared
          # `observability.metricsPort` value so engine + operator
          # cannot drift.
          args:
            - --leader-elect
            - --health-probe-bind-address=:{{ .Values.controlPlane.service.port }}
            - --metrics-bind-address=:{{ .Values.observability.metricsPort }}
            - --metrics-secure=false
          ports:
            - name: probe
              containerPort: {{ .Values.controlPlane.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.observability.metricsPort }}
              protocol: TCP
          env:
            {{- include "spectre.commonEnv" . | nindent 12 }}
            {{- include "spectre.observabilityEnv" . | nindent 12 }}
            {{- include "spectre.tlsEnv" . | nindent 12 }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "spectre.tlsVolumeMounts" . | nindent 10 }}
          readinessProbe:
            {{- toYaml .Values.controlPlane.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.controlPlane.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spectre.fullname" . }}-control-plane
  labels:
    {{- include "spectre.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: probe
      protocol: TCP
      name: probe
    - port: {{ .Values.observability.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "spectre.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
{{- end }}
