# Spectre Helm chart — default values
#
# Every key in this file is documented by values.schema.json
# (JSON Schema draft-07; validated by Helm at install time).
#
# Override patterns:
#   helm install spectre build/helm/spectre/ -f my-values.yaml
#   helm install spectre build/helm/spectre/ --set engine.replicas=2
#
# Architectural rationale: ADR-0030.

# ---------------------------------------------------------------
# Global image configuration
# ---------------------------------------------------------------
image:
  # Docker Hub registry / namespace. The five spectre-* images
  # live under this namespace. Override for private registries.
  # See ADR-0030 §5 for override patterns.
  registry: docker.io/fabiocaffarello

  # Pull policy. `IfNotPresent` is the default; use `Never` for
  # local-built images (kind / minikube); use `Always` for
  # development against rolling tags.
  pullPolicy: IfNotPresent

  # Pull secrets. Empty default; populate for private
  # registries. Each entry is a Kubernetes Secret name.
  pullSecrets: []

# ---------------------------------------------------------------
# Engine — the v1alpha1 scraping engine
# (see docs/architecture/engine.md)
# ---------------------------------------------------------------
engine:
  enabled: true
  replicas: 1

  image:
    # Image name (combined with global image.registry).
    repository: spectre-engine
    # Tag (combined with global image.pullPolicy). Empty
    # falls through to .Chart.AppVersion.
    tag: ""

  service:
    type: ClusterIP
    port: 8090

  # Multi-arch posture per ADR-0030 §6.1. Engine is amd64-only
  # at v1alpha1 (musl static binary; aarch64-musl cross-compile
  # is the canonical unblock per ADR-0018 §5 R6.5.3 update).
  # Delete this block when the unblock lands.
  nodeSelector:
    kubernetes.io/arch: amd64

  # Resource hints. v1alpha1 defaults; override for production
  # sizing.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Probe configuration. Kubernetes-native gRPC probe (1.27+
  # stable) — no in-image grpc_health_probe binary needed.
  # See ADR-0030 §7.
  probes:
    readiness:
      grpc:
        port: 8090
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
    liveness:
      grpc:
        port: 8090
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5

  # Engine-specific environment overrides. The chart sets
  # SPECTRE_POSTGRES_URL, SPECTRE_KAFKA_BROKERS,
  # SPECTRE_REDIS_URL, SPECTRE_S3_ENDPOINT automatically from
  # the stateful subcharts' service names. Override to point at
  # external instances.
  extraEnv: []

  # Pod-level customisation. All empty by default.
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  tolerations: []

# ---------------------------------------------------------------
# Control plane (operator)
# (see docs/architecture/control-plane.md)
# ---------------------------------------------------------------
controlPlane:
  enabled: true
  replicas: 1

  image:
    repository: spectre-control-plane
    tag: ""

  service:
    type: ClusterIP
    port: 8081

  # Multi-arch posture per ADR-0030 §6.1. Control plane is
  # multi-arch (linux/amd64 + linux/arm64) as of R6.5.3 publish.
  # No nodeSelector — Kubernetes scheduler picks any node.
  nodeSelector: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # HTTP probes against controller-runtime's healthz/readyz
  # endpoints. See ADR-0030 §7.2.
  probes:
    readiness:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
    liveness:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15

  # ServiceAccount + RBAC are managed by the chart automatically
  # from operators/control-plane/config/rbac/. Override the SA
  # name only if integrating with an external IRSA / Workload
  # Identity setup.
  serviceAccount:
    create: true
    name: ""

  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  tolerations: []

# ---------------------------------------------------------------
# Playwright adapter
# ---------------------------------------------------------------
playwrightAdapter:
  enabled: true
  replicas: 1

  image:
    repository: spectre-playwright
    tag: ""

  service:
    type: ClusterIP
    port: 8091

  # Multi-arch posture per ADR-0030 §6.1. Playwright is
  # multi-arch (linux/amd64 + linux/arm64) as of R6.5.3 publish.
  nodeSelector: {}

  # Playwright needs more resources due to Chromium runtime.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  probes:
    readiness:
      grpc:
        port: 8091
      initialDelaySeconds: 15
      periodSeconds: 10
    liveness:
      grpc:
        port: 8091
      initialDelaySeconds: 60

  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  tolerations: []

# ---------------------------------------------------------------
# SeleniumBase adapter
# ---------------------------------------------------------------
seleniumbaseAdapter:
  enabled: true
  replicas: 1

  image:
    repository: spectre-seleniumbase
    tag: ""

  service:
    type: ClusterIP
    port: 8092

  # Multi-arch posture per ADR-0030 §6.1. SeleniumBase is
  # amd64-only at v1alpha1 (Google Chrome stable for Linux is
  # amd64-only). Unblock options per ADR-0018 §5 R6.5.3 update:
  # switch to Chromium, or wait for upstream Chrome arm64.
  # Delete this block when the unblock lands.
  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  probes:
    readiness:
      grpc:
        port: 8092
      initialDelaySeconds: 15
      periodSeconds: 10
    liveness:
      grpc:
        port: 8092
      initialDelaySeconds: 60

  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  tolerations: []

# ---------------------------------------------------------------
# curl-impersonate adapter
# ---------------------------------------------------------------
curlImpersonateAdapter:
  enabled: true
  replicas: 1

  image:
    repository: spectre-curl-impersonate
    tag: ""

  service:
    type: ClusterIP
    port: 8093

  # Multi-arch posture per ADR-0030 §6.1. curl-impersonate is
  # amd64-only at v1alpha1 (runtime base
  # lwthiker/curl-impersonate:0.6-chrome is amd64-only on
  # Docker Hub). Unblock options per ADR-0018 §5 R6.5.3 update:
  # (a) wait upstream multi-arch, (b) fork the upstream image,
  # (c) cross-compile from source. Delete this block when the
  # unblock lands.
  nodeSelector:
    kubernetes.io/arch: amd64

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  probes:
    readiness:
      grpc:
        port: 8093
      initialDelaySeconds: 5
      periodSeconds: 5
    liveness:
      grpc:
        port: 8093
      initialDelaySeconds: 15

  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  affinity: {}
  tolerations: []

# ---------------------------------------------------------------
# Stateful dependencies — Bitnami subcharts
# Each can be disabled to use an external instance. ADR-0030 §4.
# ---------------------------------------------------------------

# PostgreSQL — engine state + operator state
postgresql:
  enabled: true
  auth:
    username: spectre
    password: spectre_chart_default_password
    database: spectre
  primary:
    persistence:
      size: 8Gi

# Redis — session store + cache
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      size: 2Gi

# Kafka — output sink
kafka:
  enabled: true
  controller:
    replicaCount: 1
    # Override Kafka's hardcoded defaults for internal-topic
    # replication so a single-broker deployment can actually
    # serve idempotent / transactional producers. The engine
    # sets `enable.idempotence=true` (ADR-0023 §3 R4.4 addendum),
    # which requires the broker's transaction coordinator, which
    # in turn requires the `__transaction_state` topic — whose
    # replication factor defaults to 3 (unreachable on a single
    # broker), leaving InitProducerId hanging / silently failing
    # and producer publishes never landing on the topic. The
    # Compose stack at `docker-compose.yml` already sets these
    # via `KAFKA_*_REPLICATION_FACTOR=1` env vars; this block is
    # the chart-side equivalent. Production deployments that bump
    # `controller.replicaCount` must also raise these factors to
    # match. Production-smoke mini-phase, 2026-05-07.
    extraConfig: |
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
      default.replication.factor=1
      min.insync.replicas=1
  listeners:
    client:
      protocol: PLAINTEXT

# MinIO — S3-compatible storage for output sink
minio:
  enabled: true
  auth:
    rootUser: spectre
    rootPassword: spectre_chart_default_password
  defaultBuckets: spectre-outputs
  persistence:
    size: 10Gi

# ---------------------------------------------------------------
# Observability — ADR-0031 commitments
# (see docs/architecture/observability.md, docs/adr/0031-observability-framework.md)
# ---------------------------------------------------------------

# W3.1 Cluster F landed: the engine sidecar + operator metrics
# server both bind `:9090` per ADR-0031 §3.3. `otlpEndpoint` opts
# in to OTLP/gRPC trace push (Cluster A pattern: empty → no-op
# tracer; spans still get valid IDs and propagate downstream via
# W3C `traceparent`). `serviceMonitor.enabled` renders a
# Prometheus Operator ServiceMonitor selecting the engine +
# control-plane Services on the shared metrics port — requires
# the `monitoring.coreos.com/v1` CRDs already in the cluster.
observability:
  # OTLP/gRPC trace endpoint (host:port or http://host:port).
  # Empty → no-op tracer; engine + operator still emit spans
  # with valid IDs that propagate via traceparent, but they are
  # not exported. Set to the in-cluster collector when the
  # `opentelemetry-collector` subchart is enabled — e.g.
  # `"<release>-opentelemetry-collector.<namespace>.svc.cluster.local:4317"`.
  otlpEndpoint: ""

  # Sidecar / controller-runtime metrics port. The engine binary
  # honours `SPECTRE_METRICS_PORT`; the operator honours
  # `--metrics-bind-address=:<port>`. Both default to 9090 per
  # ADR-0031 §3.3 (uniform across the catalog).
  metricsPort: 9090

  # ServiceMonitor (Prometheus Operator CRD) renders when
  # `enabled: true`. Requires `monitoring.coreos.com/v1` in the
  # cluster — `kubectl get crds | grep servicemonitors` to verify.
  # Falls back to manual scrape configuration if disabled.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Additional labels merged onto the ServiceMonitor for
    # `prometheus-operator`'s `serviceMonitorSelector` matching.
    additionalLabels: {}

# ---------------------------------------------------------------
# mTLS — ADR-0032 service-to-service auth
# (see docs/architecture/authentication.md, docs/adr/0032-service-to-service-mtls.md)
# ---------------------------------------------------------------

# W3.3 first auth PR landed the operator ↔ engine mTLS wiring;
# Wave 3 second auth PR (W3.4) extends to engine ↔ adapters; Wave 5+
# infra-services inherit the canonical shape ADR-0036 §5.5 commits.
#
# Default `enabled: false` keeps v1alpha1's plaintext posture per
# ADR-0032 §2.4 — deployments without cert-manager installed
# continue to work unchanged. Operators with cert-manager present
# flip the flag on; the `_helpers.tpl::spectre.certificate`
# template renders per-service `Certificate` resources, services
# mount the issued Secrets at `/etc/spectre/tls/`, and the engine +
# operator switch their gRPC transport to mTLS.
#
# Helm cannot dot-traverse keys with hyphens — `.Values.cert-manager`
# parses as subtraction in Go templates. The chart uses camelCase
# `certManager` here while ADR-0032 §2.4 prose nominally describes
# the value tree as `cert-manager` (illustrative, not a constraint).
certManager:
  enabled: false

  # cert-manager Issuer reference. The chart does not bundle an
  # Issuer (per ADR-0032 §3.1 — deployment-side choice). Wire to a
  # ClusterIssuer (or namespaced Issuer with `kind: Issuer`) that
  # cert-manager resolves. Common defaults by environment:
  #   - dev / CI:        kind: ClusterIssuer, name: spectre-selfsigned
  #   - single-cluster:  kind: ClusterIssuer, name: spectre-internal-ca
  #   - multi-cluster:   kind: ClusterIssuer, name: vault-ca
  # build/helm/test/cluster-issuer-ci.yaml ships a SelfSigned
  # ClusterIssuer for the mtls-smoke workflow.
  issuerRef:
    name: spectre-selfsigned
    kind: ClusterIssuer

# ---------------------------------------------------------------
# OpenTelemetry Collector subchart (optional)
# ---------------------------------------------------------------

# Renders only when `enabled: true`. Deployments that already
# run a collector keep this `false` and point
# `observability.otlpEndpoint` at the existing collector. The
# subchart's full upstream value surface is reachable here — see
# https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
# for the documented overrides.
opentelemetry-collector:
  enabled: false
  # Deployment mode (alternatives: `daemonset`, `statefulset`).
  # `deployment` matches the contrib chart default for the
  # gateway-style aggregating collector W3.1 expects.
  mode: deployment
  # Use the upstream `otelcol-contrib` image which bundles the
  # extra processors (resourcedetection, attributes) most real
  # deployments end up needing. The base `otelcol` image works too
  # — override via `.image.repository` to switch.
  image:
    repository: otel/opentelemetry-collector-contrib
  # Minimal default pipeline: receive OTLP, batch, log to stdout.
  # Replace with the deployment's actual exporter (Tempo, Jaeger,
  # Prometheus remote-write, ...) per ADR-0031 §2.2.
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
