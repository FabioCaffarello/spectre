# cert-manager bootstrap for the W3.3 mtls-smoke workflow.
#
# Three resources land together because mTLS requires both peers
# to chain to a shared trust anchor. SelfSigned-only would leave
# each per-service Certificate as its own root, which cannot
# satisfy mutual verification — peers must trust a common CA.
# The canonical cert-manager bootstrap (per
# https://cert-manager.io/docs/configuration/selfsigned/) is:
#
#   1. SelfSigned ClusterIssuer (`spectre-selfsigned-root`) —
#      issues exactly one Certificate, the CA below. No leaf
#      certs use this Issuer directly.
#   2. CA Certificate (`spectre-ca`) — `isCA: true`; the
#      self-signed CA whose key signs every per-service leaf
#      cert. Secret `spectre-ca` carries the cert + private key.
#   3. CA ClusterIssuer (`spectre-selfsigned`) — wraps the
#      `spectre-ca` Secret; per-service Certificates name this
#      Issuer in `issuerRef` and inherit the shared root.
#
# `spectre-selfsigned` is the name `build/helm/spectre/values.yaml`
# defaults to (`certManager.issuerRef.name`). Operators with their
# own internal CA override the name to point at their Issuer; the
# CI workflow keeps the default.
#
# Applied via `kubectl apply -f` before `helm install` because
# cluster-scoped resources (ClusterIssuer) are not chart-scoped.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: spectre-selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spectre-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: spectre-ca
  secretName: spectre-ca
  duration: 8760h  # 1 year (CI scope; production tunes longer)
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: spectre-selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: spectre-selfsigned
spec:
  ca:
    secretName: spectre-ca
