# In-cluster webhook receiver for the R7.2 production-smoke gate.
#
# The image `mendhak/http-https-echo:31` is a single-purpose Node.js
# server whose only job is to log every received HTTP request
# (method, headers, body) to stdout. R7.2's verify-webhook-sink.sh
# greps the pod logs for the expected POST shape that the engine's
# webhook emitter produces (ADR-0024 §4 header schema).
#
# Image digest pin: the digest below pins the multi-arch manifest
# list for `mendhak/http-https-echo:31` at R7.2 merge time. ADR-0030
# §4's subchart-pinning policy extends to test fixtures by analogy
# — no version drift in CI. The workflow runs a digest-verification
# step on each invocation; if mendhak republishes :31, a warning
# surfaces (the pinned digest still pulls because Docker Hub
# preserves digests indefinitely).
#
# Resource footprint: ~50 MB image, <10 MB RSS at runtime. No
# persistence; receiver state lives in pod logs only and is
# acceptable for a CI-lifetime fixture.
#
# Refs: ADR-0024 §4 (webhook sink contract); R7.2 phase prompt
# Cluster A; build/helm/test/samples/webhook.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: spectre-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-webhook-receiver
  namespace: spectre-system
  labels:
    app.kubernetes.io/name: mock-webhook-receiver
    app.kubernetes.io/component: test-fixture
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-webhook-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-webhook-receiver
        app.kubernetes.io/component: test-fixture
    spec:
      containers:
        - name: receiver
          # Pinned to the multi-arch manifest list digest of
          # mendhak/http-https-echo:31. The tag is for human
          # readability; the @sha256: digest is the supply-chain
          # anchor. Both must update together (see workflow's
          # "Verify mock-webhook-receiver digest pin" step).
          image: docker.io/mendhak/http-https-echo:31@sha256:0fefe04350131d7bb28355e3bf037062643e45f4a8a32f23679529e1b09d8ce4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          env:
            - name: HTTP_PORT
              value: "8888"
            - name: LOG_WITHOUT_NEWLINE
              value: "false"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # The image is a Node.js HTTP echo server with no health
          # endpoint. A TCP probe on the listen port is the
          # appropriate readiness signal.
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mock-webhook-receiver
  namespace: spectre-system
  labels:
    app.kubernetes.io/name: mock-webhook-receiver
    app.kubernetes.io/component: test-fixture
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: mock-webhook-receiver
