default_language_version:
  python: python3

# Heavy checks (clippy, mypy, full test suites) live in CI, not pre-commit.
# This config targets sub-five-second runs on a typical commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^LICENSE$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        # devcontainer.json is JSONC (JSON with comments), the format
        # documented at containers.dev. The standard JSON parser cannot
        # read it; VS Code, JetBrains, and Codespaces all parse it
        # natively. ADR-0018.
        exclude: ^\.devcontainer/.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/bufbuild/buf
    rev: v1.50.0
    hooks:
      - id: buf-format
      - id: buf-lint

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, "feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        description: Format Go source files with gofmt
        entry: gofmt -l -w
        language: system
        files: \.go$
        pass_filenames: true

      - id: goimports
        name: goimports
        description: Manage Go imports (install via `go install golang.org/x/tools/cmd/goimports@latest`)
        entry: goimports -l -w
        language: system
        files: \.go$
        pass_filenames: true

      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust formatting with rustfmt
        entry: bash -c 'cd engines/engine && cargo fmt --all -- --check'
        language: system
        files: ^engines/engine/.*\.rs$
        pass_filenames: false
