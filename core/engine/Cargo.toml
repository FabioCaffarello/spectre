[package]
name = "spectre-engine"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
description = "Spectre engine core: DSL parsing, planning, and execution scheduling."
repository = "https://github.com/FabioCaffarello/spectre"
license = "Apache-2.0"
readme = "README.md"
keywords = ["spectre", "browser-automation", "extraction"]
categories = ["development-tools"]
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The engine speaks the Driver Protocol over gRPC. tonic provides the
# async runtime-agnostic gRPC stack; prost handles message
# (de)serialisation. Both are pulled in as direct dependencies
# (rather than dev-dependencies) so downstream consumers of the
# engine crate see the same protobuf types.
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }

[build-dependencies]
# tonic-build invokes prost-build at compile time to write the
# generated code into Cargo's OUT_DIR. See `build.rs`.
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
