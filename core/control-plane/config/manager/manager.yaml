apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: control-plane
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: control-plane
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        # PR16: pin to the `pwuser` baked into the Microsoft Playwright
        # base image (uid:gid 1001:1001). Without this the kustomize
        # default would let the kubelet pick a uid that does not own
        # /opt/spectre/adapters and the manager binary, causing
        # CrashLoopBackOff with "permission denied".
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        # PR17 §4.4: opt the SeleniumBase adapter into the
        # container-friendly Chrome flags
        # (`--no-sandbox --disable-dev-shm-usage --disable-gpu
        # --disable-software-rasterizer --user-data-dir=<tmp>`).
        # Without this, Chrome's zygote refuses to launch its
        # sandbox under the `restricted` PodSecurityStandard and
        # Navigate fails with "Chrome failed to start: exited
        # abnormally". The adapter's `_default_driver_factory`
        # reads the env var and forwards the flags via
        # SeleniumBase's `chromium_arg`. The Playwright adapter
        # handles its own sandbox via the /dev/shm mount and
        # ignores this knob.
        #
        # HOME=/tmp redirects every $HOME-rooted write off the
        # read-only rootfs and onto the /tmp emptyDir. Chrome's
        # crashpad child process resolves its database directory
        # under ``$HOME/.local`` independently of
        # ``--user-data-dir``; with HOME pointing at the read-only
        # /home/pwuser baked into the Microsoft Playwright base,
        # crashpad fails to create its database directory and
        # exits, which chromedriver mis-reports as "Chrome instance
        # exited". The Microsoft base only uses /home/pwuser as a
        # default; Playwright's runtime Chromium launch resolves
        # browser binaries through ``PLAYWRIGHT_BROWSERS_PATH``,
        # not HOME, so HOME=/tmp does not regress hello-hackernews.
        env:
          - name: SPECTRE_SELENIUMBASE_CONTAINER
            value: "1"
          - name: HOME
            value: /tmp
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # PR16 sized this Pod for Chromium under the bundled
        # Playwright adapter; PR17 bumps the memory limit to 3 GiB
        # so the SeleniumBase path (Python + Chrome with its
        # renderer subprocess tree) has comfortable headroom on top
        # of the resident manager + engine processes. At any moment
        # at most one adapter runs (controller-runtime's default
        # MaxConcurrentReconciles=1, plus the DSL `driver:` field
        # selects exactly one of {Chromium, Chrome}); the limit is
        # sized for whichever browser is heavier, not for both
        # simultaneously. Adjust upwards if you raise
        # MaxConcurrentReconciles or run heavier sites.
        resources:
          limits:
            cpu: "2"
            memory: 3Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
          # Chromium writes its user-data-dir, downloads, and other
          # scratch state under /tmp. R3.1 retired the
          # SubprocessRunner so the manager no longer materialises
          # the DSL to a tempfile, but the /tmp mount stays for the
          # browser side of the engine container's renderer chain.
          - name: tmp
            mountPath: /tmp
          # Chromium's renderer process uses /dev/shm for shared memory
          # between processes. The Kubernetes default of 64 MiB is
          # below Chromium's working set and surfaces as
          # "Failed to create a ProcessSingleton" / sandbox crashes.
          # 256 MiB matches the documented Playwright-in-Kubernetes
          # recipe; --disable-dev-shm-usage on the launch side is the
          # alternative but compromises the sandbox.
          - name: dshm
            mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      serviceAccountName: controller-manager
      # PR16: bump from 10s. Chromium can take a few seconds to
      # tear down a context cleanly; the reconciler in turn waits on
      # the engine subprocess. 30s is comfortably above the engine's
      # 10s adapter-shutdown deadline (ADR-0008 / launcher.rs
      # DEFAULT_SHUTDOWN_TIMEOUT) without adding meaningful latency
      # to legitimate restarts.
      terminationGracePeriodSeconds: 30
