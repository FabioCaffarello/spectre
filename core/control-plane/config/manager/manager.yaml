apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: control-plane
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: control-plane
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        # PR16: pin to the `pwuser` baked into the Microsoft Playwright
        # base image (uid:gid 1001:1001). Without this the kustomize
        # default would let the kubelet pick a uid that does not own
        # /opt/spectre/adapters and the manager binary, causing
        # CrashLoopBackOff with "permission denied".
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # PR16 bumps these for Chromium under the bundled Playwright
        # adapter. Limits are pod-level, shared across concurrent
        # ScrapeJobs; the reconciler ships with controller-runtime's
        # default MaxConcurrentReconciles=1 so concurrency is bounded
        # to one job at a time anyway. Adjust upwards if you raise
        # MaxConcurrentReconciles or run heavier sites.
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
          # Chromium writes its user-data-dir, downloads, and other
          # scratch state under /tmp. The manager itself also writes
          # the temp DSL job file the SubprocessRunner materialises.
          - name: tmp
            mountPath: /tmp
          # Chromium's renderer process uses /dev/shm for shared memory
          # between processes. The Kubernetes default of 64 MiB is
          # below Chromium's working set and surfaces as
          # "Failed to create a ProcessSingleton" / sandbox crashes.
          # 256 MiB matches the documented Playwright-in-Kubernetes
          # recipe; --disable-dev-shm-usage on the launch side is the
          # alternative but compromises the sandbox.
          - name: dshm
            mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
      serviceAccountName: controller-manager
      # PR16: bump from 10s. Chromium can take a few seconds to
      # tear down a context cleanly; the reconciler in turn waits on
      # the engine subprocess. 30s is comfortably above the engine's
      # 10s adapter-shutdown deadline (ADR-0008 / launcher.rs
      # DEFAULT_SHUTDOWN_TIMEOUT) without adding meaningful latency
      # to legitimate restarts.
      terminationGracePeriodSeconds: 30
