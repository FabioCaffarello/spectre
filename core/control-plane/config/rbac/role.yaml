---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - spectre.io
  resources:
  - scrapejobs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - spectre.io
  resources:
  - scrapejobs/finalizers
  verbs:
  - update
- apiGroups:
  - spectre.io
  resources:
  - scrapejobs/status
  verbs:
  - get
  - patch
  - update
