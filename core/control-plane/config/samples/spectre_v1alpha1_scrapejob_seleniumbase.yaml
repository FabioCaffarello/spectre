# Sample ScrapeJob targeting the SeleniumBase adapter. The inline DSL
# mirrors examples/seleniumbase-extract/job.yaml — the same shape as
# the Playwright sample, swapping only the driver field.
apiVersion: spectre.io/v1alpha1
kind: ScrapeJob
metadata:
  name: seleniumbase-extract
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: seleniumbase
    steps:
      - navigate: https://example.com
      - extract:
          selector: a
          fields:
            text: textContent
            url: href
    output:
      format: jsonl
      path: ./links.jsonl
  outputSink: stdout
