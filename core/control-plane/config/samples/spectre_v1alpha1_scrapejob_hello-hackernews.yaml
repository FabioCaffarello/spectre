# Sample ScrapeJob targeting the Playwright adapter. The inline DSL
# mirrors examples/hello-hackernews/job.yaml. PR14's reconciler
# transitions Pending → Running → Completed via StubRunner; PR15+ will
# wire SubprocessRunner so this job actually fetches the Hacker News
# front page.
apiVersion: spectre.io/v1alpha1
kind: ScrapeJob
metadata:
  name: hello-hackernews
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: playwright
    steps:
      - navigate: https://news.ycombinator.com
      - extract:
          selector: .titleline > a
          fields:
            title: textContent
            url: href
    output:
      format: jsonl
      path: ./stories.jsonl
  outputSink: stdout
