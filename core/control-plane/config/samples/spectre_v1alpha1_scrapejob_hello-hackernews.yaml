# Sample ScrapeJob targeting the Playwright adapter. The inline DSL
# mirrors examples/hello-hackernews/job.yaml. The reconciler
# transitions Pending → Running → Completed via the JobRunner wired
# in main.go — EngineClientRunner (R3.1) in production deployments,
# StubRunner in the envtest suite. The Playwright adapter and engine
# services are dialled by hostname; with the Compose stack (R6.2) up,
# this job fetches the Hacker News front page end-to-end.
apiVersion: spectre.io/v1alpha1
kind: ScrapeJob
metadata:
  name: hello-hackernews
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: playwright
    steps:
      - navigate: https://news.ycombinator.com
      - extract:
          selector: .titleline > a
          fields:
            title: textContent
            url: href
    output:
      format: jsonl
      path: ./stories.jsonl
  outputSink: stdout
