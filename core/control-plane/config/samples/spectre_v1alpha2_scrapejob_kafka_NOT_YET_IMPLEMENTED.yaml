# ⚠ Schema-only sample — applying this manifest produces a Failed
# ScrapeJob. The OutputSink.Kafka variant exists in the v1alpha2
# CRD schema for forward-compatibility (the Kafka producer lands in
# R4.4); the reconciler rejects it at admission with the message
# "kafka output sink not yet implemented (R4.4)".
#
# This file documents the schema-ahead-of-functionality pattern
# called out in master strategy §3 and the ADR-0019 R3.2 addendum.
# After R4.4 lands, this sample is renamed to
# spectre_v1alpha2_scrapejob_kafka.yaml and the warning header is
# removed.
#
# The CR is a valid v1alpha2 ScrapeJob: jobDSL is non-empty,
# engineRef and outputSink each satisfy their CEL exactly-one-of
# rules. Apiserver admission accepts it; the reconciler rejects it
# at the Pending → Running boundary.
apiVersion: spectre.io/v1alpha2
kind: ScrapeJob
metadata:
  name: kafka-not-yet-implemented
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: playwright
    steps:
      - navigate: https://news.ycombinator.com
      - extract:
          selector: .titleline > a
          fields:
            title: textContent
            url: href
    output:
      format: jsonl
      path: ./stories.jsonl
  engineRef:
    service:
      name: spectre-engine
      namespace: spectre-system
      port: 9090
  outputSink:
    kafka:
      brokers:
        - kafka.spectre-system.svc.cluster.local:9092
      topic: spectre.rows
