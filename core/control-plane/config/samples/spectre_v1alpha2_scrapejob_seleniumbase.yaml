# Sample ScrapeJob targeting the SeleniumBase adapter. The inline
# DSL mirrors examples/seleniumbase-extract/job.yaml — the only
# differences from the Playwright sample are the `driver:` field
# and the metadata.name.
apiVersion: spectre.io/v1alpha2
kind: ScrapeJob
metadata:
  name: seleniumbase-extract
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: seleniumbase
    steps:
      - navigate: https://example.com
      - extract:
          selector: a
          fields:
            text: textContent
            url: href
    output:
      format: jsonl
      path: ./links.jsonl
  engineRef:
    service:
      name: spectre-engine
      namespace: spectre-system
      port: 9090
  outputSink:
    stdout: {}
