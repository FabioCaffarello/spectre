# Sample ScrapeJob using the EngineRef.Endpoint form for ad-hoc
# testing inside the post-R6.3 unified Compose stack. The operator
# (the `control-plane` Compose service) dials the Compose-internal
# `engine:8090` hostname directly. The same endpoint matches the
# operator's `SPECTRE_ENGINE_ENDPOINT` fallback, so a sample without
# an `engineRef` field would resolve identically — the explicit
# endpoint here makes the demo's intent visible.
#
#   $ just images        # build the five service images
#   $ just kind-up       # create the local kind cluster (idempotent)
#   $ just compose-up    # bring up eleven services incl. operator
#   $ kubectl apply -f config/samples/spectre_v1alpha2_scrapejob_endpoint.yaml
#   $ kubectl get scrapejob -w
#
# `spectre_v1alpha2_scrapejob_hello-hackernews.yaml` (Service form)
# is the in-cluster pattern R7.1's Helm chart targets.
apiVersion: spectre.io/v1alpha2
kind: ScrapeJob
metadata:
  name: hello-hackernews-endpoint
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: playwright
    steps:
      - navigate: https://news.ycombinator.com
      - extract:
          selector: .titleline > a
          fields:
            title: textContent
            url: href
    output:
      format: jsonl
      path: ./stories.jsonl
  engineRef:
    endpoint: engine:8090
  outputSink:
    stdout: {}
