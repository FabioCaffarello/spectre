# Sample ScrapeJob targeting the curl-impersonate adapter. The inline
# DSL mirrors examples/curl-impersonate-extract/job.yaml. This driver
# declares only the four-capability intersection (navigation,
# query_css, extract_text, extract_attribute) per ADR-0017.
apiVersion: spectre.io/v1alpha2
kind: ScrapeJob
metadata:
  name: curl-impersonate-extract
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: curl-impersonate
    steps:
      - navigate: https://example.com
      - extract:
          selector: a
          fields:
            text: textContent
            url: href
    output:
      format: jsonl
      path: ./links.jsonl
  engineRef:
    service:
      name: spectre-engine
      namespace: spectre-system
      port: 9090
  outputSink:
    stdout: {}
