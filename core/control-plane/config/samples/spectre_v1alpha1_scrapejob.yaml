apiVersion: spectre.io/v1alpha1
kind: ScrapeJob
metadata:
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/managed-by: kustomize
  name: scrapejob-sample
spec:
  jobDSL: |
    spectre: v1alpha1
    driver: playwright
    steps:
      - navigate: https://example.com
      - extract:
          selector: h1
          fields:
            heading: textContent
    output:
      format: jsonl
      path: ./results.jsonl
  outputSink: stdout
