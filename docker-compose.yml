# Spectre — local-development Compose stack.
#
# R6.2 brought the application services (engine + three reference
# adapters) into the Compose stack alongside the stateful services
# from R4.x and R5.1. R6.3 added the control-plane operator as the
# eleventh service (ADR-0025 §6 R6.3 update). The full development
# graph is eleven services on the Compose default network plus a
# kind cluster on its own Docker network — the operator joins both.
# The recommended invocation is `docker compose --profile full up
# -d` (aliased as `just compose-up`). See ADR-0025 for the
# topology, profile design, port-migration scope, conformance-suite
# scope, and the resolved operator + kind deferral.
#
# Operator topology (ADR-0025 §6 R6.3 update). The control plane
# (`operators/control-plane/`) runs as the `control-plane` Compose
# service. It dials `engine:8090` on the Compose default network
# and `spectre-dev-control-plane:6443` on the external `kind`
# Docker network (kind names the API-server node after the cluster).
# The kubeconfig at `build/kind/kubeconfig` (written by `just
# kind-up` with the `--internal` flag, server URL
# `https://spectre-dev-control-plane:6443`) is mounted read-only
# at `/home/nonroot/.kube/config`. The contributor flow is `just
# kind-up && just compose-up`; on first devcontainer build the
# post-create script runs `kind-up` automatically.
#
# Profiles (ADR-0025 §4 + §6 R6.3 update):
#   infra    — six stateful services only (pre-R6.2 default).
#              Used by the conformance suite (subprocess-spawned
#              adapters) and by contributors running native-binary
#              application services via `just engine-run-native`.
#   core     — postgres + kafka + minio + minio-bootstrap + engine.
#              Engine integration tests target this profile.
#   adapters — redis + the three adapter services. Adapter-only
#              experimentation via `grpcurl`.
#   app      — headless full stack (no observability UIs) +
#              control-plane operator. Aimed at CI runs.
#   full     — everything (app + kafka-console). Default human
#              dev flow. The README quick-start uses this profile.
#
# Image source policy (ADR-0025 §8): every application service
# uses `image: spectre-<name>:dev` + `pull_policy: never`. Images
# must be built first via `just images` (the bake umbrella). No
# `build:` directives — bake is the canonical build path; a
# missing image surfaces immediately as "image not found".
#
# Port reservations (ADR-0025 §7 + ADR-0021 §4):
#   8090 — engine                      (Compose-internal `engine:8090`)
#   8091 — playwright-adapter          (`playwright-adapter:8091`)
#   8092 — seleniumbase-adapter        (`seleniumbase-adapter:8092`)
#   8093 — curl-impersonate-adapter    (`curl-impersonate-adapter:8093`)
#   8080 — kafka-console (UI)
#   9000 — minio (S3 API), 9001 — minio (UI)
#   9092 — kafka broker (Compose-internal `kafka:9092`, host 9092)
#   5432 — postgres
#   6379 — redis
#
# Usage:
#   docker compose --profile full up -d   # start (recommended)
#   docker compose ps                     # health
#   docker compose down                   # stop, keep volumes
#   docker compose down -v                # stop, drop volumes (full reset)
#
# DEV-ONLY: the credentials below are visible in source control.
# Production deployments populate `SPECTRE_POSTGRES_URL`,
# `SPECTRE_REDIS_URL`, and `SPECTRE_KAFKA_BROKERS` from Kubernetes
# Secrets per ADR-0023 §10 / §12. Do not reuse these values
# anywhere persistent.

services:
  postgres:
    image: postgres:16-alpine
    container_name: spectre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spectre
      POSTGRES_PASSWORD: spectre_dev_password
      POSTGRES_DB: spectre
    ports:
      - "5432:5432"
    volumes:
      - spectre_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectre -d spectre"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["infra", "core", "app", "full"]

  # Redis — adapter session metadata cache (ADR-0023 §4).
  # AOF persistence keeps session metadata across `docker compose
  # down` for dev convenience; production behaves the same when
  # the Bitnami chart's persistence is enabled (ADR-0023 §10).
  # `allkeys-lru` caps memory at 256 MiB and evicts cold keys so
  # an extended local-dev session can't grow unbounded.
  redis:
    image: redis:7-alpine
    container_name: spectre-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--maxmemory", "256mb",
        "--maxmemory-policy", "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    volumes:
      - spectre_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["infra", "adapters", "app", "full"]

  # Apache Kafka in KRaft mode (no ZooKeeper) — engine producer
  # target for `OutputSink.Kafka` jobs (ADR-0023 §3 R4.4 addendum).
  # Production parity with R7.1's Strimzi-managed Apache Kafka
  # Helm chart; KRaft simplifies Compose by eliminating the
  # ZooKeeper service.
  #
  # Single-broker single-controller — sufficient for v1alpha1
  # local dev. The replication factors below are pinned to 1
  # because there is no second broker; production `values.yaml`
  # raises them to the cluster's RF (typically 3).
  #
  # KAFKA_AUTO_CREATE_TOPICS_ENABLE=true is a dev convenience.
  # Production deployments disable auto-create and provision
  # topics explicitly (Strimzi `KafkaTopic` CRs in R7.1).
  kafka:
    image: apache/kafka:3.7.1
    container_name: spectre-kafka
    restart: unless-stopped
    # PLAINTEXT (9092 inside the Compose network) carries
    # broker-to-broker + Compose-internal client traffic. HOST
    # (9094 inside the container, mapped to 9092 on the host) is
    # the host-port ingress for native binaries running outside
    # Compose; it advertises as localhost:9092 so resolved
    # bootstrap metadata is reachable from the host.
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "8"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "spectre-dev-cluster-id22"
    volumes:
      - spectre_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    profiles: ["infra", "core", "app", "full"]

  # Redpanda Console — web UI over Apache Kafka API (works
  # against any Kafka-compatible broker; the name is historical).
  # Serves topic browsing, consumer-offset inspection, and
  # message preview at http://localhost:8080. The UI is local-dev
  # only; production observability lives in Strimzi / managed
  # tooling per R7.1.
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: spectre-kafka-console
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "kafka:9092"
      CONFIG_FILEPATH: ""
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8080/admin/health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    # `kafka-console` is excluded from `app` (ADR-0025 §4): the UI
    # adds startup time and serves no purpose in a non-interactive
    # CI run. `full` is the human-facing profile that includes it.
    profiles: ["infra", "full"]

  # MinIO — S3-compatible object store for OutputSink.S3 jobs
  # (R5.1 — ADR-0024 §3). Single-node single-drive for dev;
  # production deployments replace with real S3 or a clustered
  # MinIO. Port 9000 is the S3 API; port 9001 is the embedded
  # web console (object browser, bucket policies, IAM). Unlike
  # Kafka, MinIO embeds its own UI — no separate console
  # service is required.
  #
  # Credentials are visible in source control for dev
  # convenience; production deployments populate
  # SPECTRE_S3_ACCESS_KEY_ID + SPECTRE_S3_SECRET_ACCESS_KEY (or
  # leave them unset to use the AWS default credential chain)
  # per ADR-0023 §10 / ADR-0024 §3.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: spectre-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console UI
    environment:
      MINIO_ROOT_USER: spectre_dev_access
      MINIO_ROOT_PASSWORD: spectre_dev_secret_key
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - spectre_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set local http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["infra", "core", "app", "full"]

  # MinIO bucket bootstrap — runs once on stack-up and pre-
  # creates the `spectre-rows` bucket so the engine integration
  # tests, conformance tests, and sample manifests do not need
  # a "create bucket if not exists" preamble. `mc` is the MinIO
  # client CLI shipping its own image; the container exits zero
  # after `mc mb`. ADR-0024 §3 documents that production
  # deployments pre-create buckets via Terraform / Crossplane
  # / manual console action — auto-create-from-engine is
  # explicitly out of scope for v1alpha1.
  minio-bootstrap:
    image: quay.io/minio/mc:latest
    container_name: spectre-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/spectre-rows &&
        echo "bucket spectre-rows ready"
    environment:
      MINIO_ROOT_USER: spectre_dev_access
      MINIO_ROOT_PASSWORD: spectre_dev_secret_key
    profiles: ["infra", "core", "app", "full"]

  # ---------------------------------------------------------------------------
  # Application services (R6.2 — see ADR-0025 §3 + §7 + §8).
  #
  # Every application service consumes a local-built image produced
  # by `just images` (the bake umbrella from R6.1). `pull_policy:
  # never` prevents Compose from contacting a registry — local
  # images are the only source. Run `just images` before
  # `just compose-up`.
  # ---------------------------------------------------------------------------

  # Engine — gRPC service for `RunJob` execution. Reads
  # SPECTRE_POSTGRES_URL + SPECTRE_KAFKA_BROKERS + SPECTRE_S3_*
  # at startup; dials adapters lazily per-job via
  # SPECTRE_PLAYWRIGHT_ENDPOINT / SPECTRE_SELENIUMBASE_ENDPOINT /
  # SPECTRE_CURL_IMPERSONATE_ENDPOINT. ADR-0025 §3 documents the
  # absence of a Compose-level healthcheck: the distroless static
  # runtime ships no shell or probe binary, and dependent-service
  # gRPC dial retry (ADR-0022 §4) covers liveness without a
  # bundled `grpc_health_probe`. R7.1's Helm chart will use
  # Kubernetes's native `grpc:` readinessProbe syntax.
  engine:
    image: spectre-engine:dev
    container_name: spectre-engine
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    environment:
      SPECTRE_ENGINE_PORT: "8090"
      SPECTRE_POSTGRES_URL: "postgres://spectre:spectre_dev_password@postgres:5432/spectre"
      SPECTRE_KAFKA_BROKERS: "kafka:9092"
      SPECTRE_PLAYWRIGHT_ENDPOINT: "grpc://playwright-adapter:8091"
      SPECTRE_SELENIUMBASE_ENDPOINT: "grpc://seleniumbase-adapter:8092"
      SPECTRE_CURL_IMPERSONATE_ENDPOINT: "grpc://curl-impersonate-adapter:8093"
      SPECTRE_S3_ENDPOINT: "http://minio:9000"
      SPECTRE_S3_ACCESS_KEY_ID: "spectre_dev_access"
      SPECTRE_S3_SECRET_ACCESS_KEY: "spectre_dev_secret_key"
      SPECTRE_S3_REGION: "us-east-1"
      RUST_LOG: "${RUST_LOG:-info,spectre_engine=debug}"
    ports:
      - "8090:8090"
    profiles: ["core", "app", "full"]

  # Playwright adapter — TypeScript/Node, Chromium runtime.
  # Healthcheck uses bash's built-in /dev/tcp redirect because the
  # Microsoft Playwright Ubuntu Noble base ships bash but not
  # `nc` (ADR-0025 §3 healthcheck-asymmetry note).
  playwright-adapter:
    image: spectre-playwright:dev
    container_name: spectre-playwright-adapter
    pull_policy: never
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPECTRE_ADAPTER_GRPC_PORT: "8091"
      SPECTRE_REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/127.0.0.1/8091' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles: ["adapters", "app", "full"]

  # SeleniumBase adapter — Python, Google Chrome stable runtime.
  #
  # `shm_size: 1gb` matches the upstream selenium/standalone-chrome
  # convention; Chrome's tab-isolation crashes with the default
  # 64 MiB /dev/shm (ADR-0025 §3). R7.1's Helm chart sets the
  # equivalent on the Pod spec.
  #
  # Healthcheck uses Python's socket module because the slim-bookworm
  # base does not ship `nc` (ADR-0025 §3 healthcheck-asymmetry note).
  seleniumbase-adapter:
    image: spectre-seleniumbase:dev
    container_name: spectre-seleniumbase-adapter
    pull_policy: never
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPECTRE_ADAPTER_GRPC_PORT: "8092"
      SPECTRE_REDIS_URL: "redis://redis:6379/0"
      SPECTRE_SELENIUMBASE_CONTAINER: "1"
    ports:
      - "8092:8092"
    shm_size: "1gb"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8092)); s.close()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles: ["adapters", "app", "full"]

  # curl-impersonate adapter — Go, upstream Alpine runtime.
  # Healthcheck uses busybox `nc -z` (Alpine's busybox ships it).
  curl-impersonate-adapter:
    image: spectre-curl-impersonate:dev
    container_name: spectre-curl-impersonate-adapter
    pull_policy: never
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPECTRE_ADAPTER_GRPC_PORT: "8093"
      SPECTRE_REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8093 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    profiles: ["adapters", "app", "full"]

  # Control-plane operator — Kubernetes-style controller reconciling
  # ScrapeJob CRs. R6.3 (ADR-0025 §6 R6.3 update) brings the operator
  # into the unified Compose stack alongside a kind cluster running
  # in the same Docker daemon (Docker-in-Docker, devcontainer-managed).
  #
  # Networking topology:
  #   - Joins the Compose default network → reaches `engine:8090`
  #     and `postgres:5432` by service-name DNS.
  #   - Joins the external `kind` Docker network → reaches
  #     `spectre-dev-control-plane:6443` (the in-DinD kind API
  #     server; kind names the node after the cluster).
  #   - The kubeconfig at `build/kind/kubeconfig` (host path on
  #     the devcontainer; container path
  #     `/home/nonroot/.kube/config`) is written by `just kind-up`
  #     with `--internal` so the server URL resolves on the kind
  #     Docker network. `just kind-up` must run before
  #     `compose-up`; the post-create script runs it automatically
  #     on first devcontainer build.
  #
  # No `ports:` mapping for 8081 (operator probes) — dev-mode
  # noise the contributor doesn't usually inspect. Reconciliation
  # surfaces through `kubectl get scrapejob -w` and
  # `docker compose logs control-plane`. Uncomment a `- "8081:8081"`
  # mapping if needed.
  #
  # `--metrics-bind-address=0` disables the metrics server (the
  # kubebuilder default-disable; v1alpha1 adds no Prometheus stack).
  # `--leader-elect=false` is the dev-default; R7.1's Helm chart
  # turns it on for production via values.
  control-plane:
    image: spectre-control-plane:dev
    container_name: spectre-control-plane
    pull_policy: never
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - default
      - kind
    environment:
      SPECTRE_ENGINE_ENDPOINT: "engine:8090"
      SPECTRE_POSTGRES_URL: "postgres://spectre:spectre_dev_password@postgres:5432/spectre"
      KUBECONFIG: "/home/nonroot/.kube/config"
    volumes:
      - ./build/kind/kubeconfig:/home/nonroot/.kube/config:ro
    command:
      - "--engine-endpoint=engine:8090"
      - "--health-probe-bind-address=:8081"
      - "--metrics-bind-address=0"
      - "--leader-elect=false"
    profiles: ["app", "full"]

# `default` is Compose's auto-named network — every other service
# uses it implicitly. `kind` is the external Docker network kind
# creates when `kind create cluster` runs (`just kind-up` —
# ADR-0025 §6 R6.3 update). Declaring it `external: true` means
# Compose attaches the control-plane container to it without
# trying to create it; if the network is missing, `compose up`
# fails with "network kind not found", which is the designed
# behaviour (run `just kind-up` first).
networks:
  default:
  kind:
    external: true
    name: kind

volumes:
  spectre_postgres_data:
  spectre_redis_data:
  spectre_kafka_data:
  spectre_minio_data:
